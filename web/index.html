     1. Course → range   practiceItems(): what to work on next
     2. Range → course   adviceFor(): which club fits the distance
     3. Calibration      calibration(): do range numbers hold up?
   Every output carries its sample size, and says so when small.
   ============================================================ */
const round5 = v => Math.round(v / 5) * 5;
const confidence = n => n >= 12 ? 'consistent' : n >= 5 ? 'emerging' : 'early signal';
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;

// Every shot logged on course, with what it was trying to do.
//   tee       first shot on a par 4 or 5
//   recovery  played from trees, bunker or water
//   short     inside 60m (pitches, chips)
//   approach  everything else, including par-3 tee shots
const shotRecords = () => memoised('shotRecords', '', shotRecordsUncached);
function shotRecordsUncached() {
  const out = [];
  for (const r of S.sessions) if (r.type === 'round') for (const h of holesOf(r)) {
    const shots = h.shots || [];
    shots.forEach((s, i) => {
      const from = i ? toGreen(h, shots[i - 1]) : (h.metres || 0);
      const len = shotLen(h, i), lie = lieOf(h, s);
      if (from == null || len == null) return;            // unplaceable shot: leave it out of the loop
      const fromLie = i ? lieOf(h, shots[i - 1]) : 'tee';
      const recovery = ['trees', 'bunker', 'water'].includes(fromLie);
      const kind = i === 0 && h.par >= 4 ? 'tee' : recovery ? 'recovery' : from < 60 ? 'short' : 'approach';
      out.push({ r, h, i, s, club: s.club, from, fromLie, lie, len, kind, full: !recovery && len >= 30 && from >= 40 });
    });
  }
  return out;
}
const shotHoleCount = () => S.sessions.filter(r => r.type === 'round').reduce((n, r) => n + (r.holes || []).filter(h => (h.shots || []).length).length, 0);

/* ---------- reference distances, with where they came from ---------- */
const rangeBlocksFor = (code, counted = false) => S.sessions.filter(s => s.type === 'range' && (!counted || countsForNumbers(s))).flatMap(s => (s.blocks || []).map(b => ({ ...b, date: s.date }))).filter(b => b.club === code);
function weighted(blocks, key) { const bs = blocks.filter(b => b.summary && b.summary[key] != null && (b.swing || 'full') === 'full'); if (!bs.length) return null; const wt = b => (b.summary.n || 1) * shotWeight(b.date); const w = sum(bs.map(wt)); return sum(bs.map(b => b.summary[key] * wt(b))) / w; }
function carryRef(code) {
  const s = clubStats(code); if (s && s.stockCarry) return { v: s.stockCarry, measured: true, src: 'range', pure: pct(s.pure, s.n) };
  const w = weighted(rangeBlocksFor(code, true), 'avgCarry'); if (w) return { v: w, measured: true, src: 'range summary' };
  const c = clubBy(code); if (!c) return null;
  if (c.nominalCarry) return { v: c.nominalCarry, measured: false, src: 'your estimate' };
  if (c.nominalTotal) return { v: c.nominalTotal * 0.9, measured: false, src: 'estimated from your total' };
  return null;
}
function totalRef(code) {
  const s = clubStats(code); if (s && s.stockTotal) return { v: s.stockTotal, measured: true, src: 'range', max: Math.max(...fullShots(code).map(x => x.total)) };
  const w = weighted(rangeBlocksFor(code, true), 'avgTotal'); if (w) return { v: w, measured: true, src: 'range summary' };
  const c = clubBy(code); if (c && c.nominalTotal) return { v: c.nominalTotal, measured: false, src: 'your estimate' };
  return null;
}

/* ---------- 2. range → course: which club fits ---------- */
function clubFit(dist) {
  const clubs = activeClubs().filter(c => c.category !== 'putter').map(c => ({ c, ref: carryRef(c.code) })).filter(x => x.ref);
  const measured = clubs.filter(x => x.ref.measured).sort((a, b) => Math.abs(a.ref.v - dist) - Math.abs(b.ref.v - dist));
  const unmeasured = clubs.filter(x => !x.ref.measured && Math.abs(x.ref.v - dist) <= 15).sort((a, b) => Math.abs(a.ref.v - dist) - Math.abs(b.ref.v - dist));
  const longest = clubs.filter(x => x.ref.measured).sort((a, b) => b.ref.v - a.ref.v)[0];
  return { best: measured[0], unmeasured: unmeasured[0], longest };
}
function adviceFor(dist) {
  if (!dist || dist < 60) return '';
  const f = clubFit(dist); if (!f.best) return '';
  const tag = x => `<b>${esc(x.c.code)}</b>`;
  if (f.longest && dist > f.longest.ref.v + 20) {
    const tot = totalRef(f.longest.c.code);
    if (tot && tot.measured && dist <= tot.v + 10) return `For ${fmt(dist)}m: ${tag(f.longest)} carries ${fmt(f.longest.ref.v)}m and runs out to about ${fmt(tot.v)}m, so it gets there if it lands short and rolls. Anything in front of the green is in play.`;
    return `Longer than any measured club. ${tag(f.longest)} carries ${fmt(f.longest.ref.v)}m${tot && tot.measured ? `, about ${fmt(tot.v)}m with roll, leaving ~${fmt(dist - tot.v)}m` : ''}.${activeClubs().some(c => c.code === 'D') && !carryRef('D') ? ' Driver has no range data yet.' : ''}`;
  }
  const b = f.best;
  return `For ${fmt(dist)}m: ${tag(b)}, stock carry ${fmt(b.ref.v)}m${b.ref.pure != null ? `, pure ${b.ref.pure}% of the time` : ''}.${f.unmeasured && f.unmeasured.c.code !== b.c.code ? ` ${tag(f.unmeasured)} should fit too but isn't measured yet.` : ''}`;
}

/* ---------- 1. course → range: what to practise ---------- */
// Each item says what it is (key), what it would cost (score, undecayed),
// the dated evidence behind it (ev: {date, cost}), and — where it can be
// counted — every chance it had to happen (chances: {date, hit}). Ranking
// and freshness are worked out from those in assessPractice().
function practiceItems() {
  const R = shotRecords(), items = [], at = x => x.r.date;
  // Tee accuracy, by club
  const tee = {};
  for (const x of R.filter(x => x.kind === 'tee' && x.club)) { const t = tee[x.club] = tee[x.club] || { n: 0, fw: 0, lies: {}, recs: [] }; t.n++; if (x.lie === 'fairway') t.fw++; else t.lies[x.lie] = (t.lies[x.lie] || 0) + 1; t.recs.push(x); }
  const W = { trees: .8, water: 1, bunker: .5, rough: .3 };
  for (const [club, t] of Object.entries(tee)) {
    if (t.fw === t.n) continue; const cs = clubStats(club), ref = carryRef(club);
    items.push({ key: 'tee:' + club, kind: 'tee', n: t.n, score: Object.entries(t.lies).reduce((a, [l, c]) => a + (W[l] ?? .3) * c, 0),
      ev: t.recs.filter(x => x.lie !== 'fairway').map(x => ({ date: at(x), cost: W[x.lie] ?? .3 })), chances: t.recs.map(x => ({ date: at(x), hit: x.lie !== 'fairway' })),
      title: `${club} off the tee: ${t.fw} of ${t.n} fairways`, detail: `Misses: ${Object.entries(t.lies).map(([l, c]) => `${c} ${l}`).join(', ')}. Distance isn't the issue${ref && ref.measured ? ` (stock carry ${fmt(ref.v)}m)` : ''}; direction is.`,
      range: cs ? `On the range: ${pct(cs.pure, cs.n)}% pure, ${pct(cs.top, cs.n)}% topped` : null,
      block: { club, swing: 'full', target: ref ? round5(ref.v) : null, intent: 'Accuracy: pick two markers about 30m apart and count how many finish between them' }, recs: t.recs });
  }
  // Approaches: clubbed short, and clubs that should be covering these distances but aren't measured
  const appr = R.filter(x => (x.kind === 'approach' || (x.i === 0 && x.h.par === 3)) && x.from >= 60 && x.club);
  const measuredAppr = appr.filter(x => { const c = carryRef(x.club); return c && c.measured; });
  const isShort = x => x.from - carryRef(x.club).v > 15;
  const short = measuredAppr.filter(isShort);
  if (short.length) {
    const med = median(short.map(x => x.from)), f = clubFit(med);
    items.push({ key: 'approach', kind: 'approach', n: appr.length, score: .5 * short.length,
      ev: short.map(x => ({ date: at(x), cost: .5 })), chances: measuredAppr.map(x => ({ date: at(x), hit: isShort(x) })),
      title: `Approaches clubbed short: ${short.length} of ${appr.length}`,
      detail: short.map(x => `${x.club} (stock ${fmt(carryRef(x.club).v)}m) from ${fmt(x.from)}m`).join('; ') + '.',
      advice: f.best ? `From ${fmt(Math.min(...short.map(x => x.from)))}–${fmt(Math.max(...short.map(x => x.from)))}m, your measured club is ${f.best.c.code} (${fmt(f.best.ref.v)}m).` : null,
      block: f.best ? { club: f.best.c.code, swing: 'full', target: round5(med), intent: `Commit to the ${f.best.c.code} at the distance your approaches came up short from` } : null, recs: short });
  }
  const bestUnmeasured = {};
  for (const x of appr) { const u = clubFit(x.from).unmeasured; if (u) (bestUnmeasured[u.c.code] = bestUnmeasured[u.c.code] || { ref: u.ref, xs: [] }).xs.push(x); }
  for (const [code, u] of Object.entries(bestUnmeasured)) {
    const ds = u.xs.map(x => x.from);
    items.push({ key: 'measure:' + code, kind: 'measure', n: u.xs.length, score: .4 * u.xs.length, ev: u.xs.map(x => ({ date: at(x), cost: .4 })),
      title: `Measure your ${code}`,
      detail: `${plural(u.xs.length, 'approach', 'approaches')} of ${fmt(Math.min(...ds))}${ds.length > 1 ? '–' + fmt(Math.max(...ds)) : ''}m, where it should sit (about ${fmt(u.ref.v)}m, ${u.ref.src}). It has no range data, so the app can't recommend it.`,
      block: { club: code, swing: 'full', target: round5(median(ds)), intent: 'Establish a stock carry: 20 balls, then add the screenshots' }, recs: u.xs });
  }
  // Clubs in the bag with no range data at all, whether or not a course has asked for them yet
  for (const c of activeClubs().filter(c => c.category !== 'putter')) {
    const ref = carryRef(c.code);
    if ((ref && ref.measured) || items.some(x => x.key === 'measure:' + c.code)) continue;
    items.push({ key: 'measure:' + c.code, kind: 'measure', n: 0, score: .3, fixedWeight: .3, ev: [], note: 'No range data yet.',
      title: `Measure your ${c.code}`, detail: `No range data for the ${c.code} yet, so it can't be planned with or recommended${ref ? ` (you've assumed about ${fmt(ref.v)}m)` : ''}.`,
      block: { club: c.code, swing: 'full', target: ref ? round5(ref.v) : null, intent: 'Establish a stock carry: 20 balls, then add the screenshots' } });
  }
  // Strike, from the range: a club that too often comes off as a low runner or a top
  for (const c of activeClubs().filter(c => c.category !== 'putter')) { const it = strikeItem(c.code); if (it) items.push(it); }
  // Short game
  const sg = R.filter(x => x.kind === 'short' && x.club), sgMiss = sg.filter(x => x.lie !== 'green');
  if (sgMiss.length) {
    const main = Object.entries(sg.reduce((a, x) => (a[x.club] = (a[x.club] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0][0];
    const chip = rangeBlocksFor(main).filter(b => b.swing === 'chip').sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    const cs = chip && blockSummary(chip);
    items.push({ key: 'short', kind: 'short', n: sg.length, score: .5 * sgMiss.length,
      ev: sgMiss.map(x => ({ date: at(x), cost: .5 })), chances: sg.map(x => ({ date: at(x), hit: x.lie !== 'green' })),
      title: `Short game: ${sgMiss.length} of ${sg.length} missed the green`,
      detail: sgMiss.map(x => `${x.club} from ${fmt(x.from)}m, finished in the ${x.lie}`).join('; ') + '.',
      range: cs && cs.fromPinTotal != null ? `On the range: your ${chip.target}m chip block finished ${fmt(cs.fromPinTotal, 1)}m from the pin on average` : null,
      block: { club: main, swing: 'chip', target: round5(median(sg.map(x => x.from))) || 20, intent: 'Land it on the green: count how many finish inside 3m' }, recs: sgMiss });
  }
  // Putting and penalties, from holes where they were logged
  const ph = S.sessions.filter(r => r.type === 'round').flatMap(r => holesOf(r).filter(h => h.putts != null).map(h => ({ r, h })));
  const threes = ph.filter(p => p.h.putts >= 3);
  if (threes.length) items.push({ key: 'putting', kind: 'putting', n: ph.length, score: threes.length,
    ev: threes.map(p => ({ date: p.r.date, cost: 1 })), chances: ph.map(p => ({ date: p.r.date, hit: p.h.putts >= 3 })),
    title: `Three-putts: ${threes.length} in ${plural(ph.length, 'hole')}`,
    detail: `${sum(ph.map(p => p.h.putts))} putts over ${plural(ph.length, 'hole')}, ${(sum(ph.map(p => p.h.putts)) / ph.length).toFixed(1)} a hole.`, practice: 'Putting green: 20 lag putts from 8–12m, trying to finish inside a metre.', recs: threes.map(p => ({ r: p.r, h: p.h })) });
  const traced = S.sessions.filter(r => r.type === 'round').flatMap(r => holesOf(r).filter(h => (h.shots || []).length).map(h => ({ r, h })));
  const pens = traced.filter(p => p.h.penalties);
  if (pens.length) items.push({ key: 'penalty', kind: 'penalty', n: shotHoleCount(), score: .6 * sum(pens.map(p => p.h.penalties)),
    ev: pens.map(p => ({ date: p.r.date, cost: .6 * p.h.penalties })), chances: traced.map(p => ({ date: p.r.date, hit: !!p.h.penalties })),
    title: `Penalty strokes: ${sum(pens.map(p => p.h.penalties))} in ${plural(shotHoleCount(), 'hole')}`,
    detail: `On ${pens.map(p => 'hole ' + p.h.n).join(', ')}. Worth checking the trace to see what caused it.`, recs: pens });
  items.push(...swingItems());
  return items.sort((a, b) => b.score - a.score);
}

// Strike, measured on the range. Flags a club when at least STRIKE_FLAG of
// its full swings (in the recency window) are low runners or tops, and
// says whether the latest session still shows it — the case where an old
// tip is still coming up today.
const STRIKE_FLAG = 0.35, STRIKE_MIN = 10;
function strikeItem(code) {
  const shots = fullShots(code); if (shots.length < STRIKE_MIN) return null;
  const prof = classify(shots), bad = (_, i) => prof[i] === 'runner' || prof[i] === 'top';
  const nBad = shots.filter(bad).length; if (nBad / shots.length < STRIKE_FLAG) return null;
  const s = clubStats(code);
  const dates = [...new Set(shots.map(x => x.date))].sort(), latest = dates[dates.length - 1];
  const inLatest = shots.map((x, i) => [x, i]).filter(([x]) => x.date === latest), before = shots.map((x, i) => [x, i]).filter(([x]) => x.date !== latest);
  const rate = xs => xs.filter(([, i]) => bad(null, i)).length / xs.length;
  let status = null, note = null;
  if (inLatest.length >= 5 && before.length >= 5) {
    const now = rate(inLatest), was = rate(before);
    if (now < STRIKE_FLAG && now <= was * 0.6) { status = 'quiet'; note = `Improving: ${Math.round(now * 100)}% in the latest session (${dateLabel(latest)}) against ${Math.round(was * 100)}% before.`; }
    else note = `Still showing up in the latest range session (${dateLabel(latest)}): ${inLatest.filter(([, i]) => bad(null, i)).length} of ${inLatest.length}, against ${Math.round(was * 100)}% before.`;
  } else note = `Last seen in the range session of ${dateLabel(latest)}.`;
  return { key: 'strike:' + code, kind: 'strike', n: shots.length, score: .05 * nBad, status, note,
    ev: shots.filter(bad).map(x => ({ date: x.date, cost: .05 })),
    title: `${code} strike: ${pct(nBad, shots.length)}% low runners or topped`,
    detail: `${s.runner} low runners and ${s.top} tops in ${shots.length} full swings.${s.pureCarry ? ` Stock carry ${fmt(s.stockCarry)}m against ${fmt(s.pureCarry)}m when you catch it pure.` : ''}`,
    block: { club: code, swing: 'full', target: round5(s.pureCarry || s.stockCarry), intent: 'Strike: count pure strikes against low runners — ball first, then turf' } };
}

/* ---------- weighting and freshness ----------
   The list grows with every round, so each item is judged on how recent its
   evidence is and whether it's still happening. Worked out on every draw
   from the dated evidence; nothing is stored.
   - weight: sum of each piece of evidence's cost, halved every
     PRACTICE_HALF_LIFE days. A judgement about how fast a beginner's game
     moves, not a measurement.
   - quiet: it had enough clean chances since it was last seen that, at its
     old rate, it would probably (80%) have happened again; or it was last
     seen more than STALE_AFTER days ago. Quiet items leave the list and the
     plan, and are listed separately with the reason.
   - practised: a range block for its club and swing was hit on or after the
     day it was last seen, and the course hasn't confirmed it yet. It stays
     on the list at half weight. */
const PRACTICE_HALF_LIFE = 60, STALE_AFTER = 180;
const ageDays = d => d ? Math.max(0, (Date.now() - new Date(d + 'T00:00:00').getTime()) / 86400000) : 0;
const decay = d => Math.pow(0.5, ageDays(d) / PRACTICE_HALF_LIFE);
// The latest day a range block for this club and swing was actually hit, on or after `since`.
function practisedSince(block, since) {
  if (!block) return null;
  return S.sessions.filter(s => s.type === 'range' && s.date && (!since || s.date >= since)
    && (s.blocks || []).some(b => b.club === block.club && (b.swing || 'full') === (block.swing || 'full') && !b.plan && ((b.shots || []).length || b.summary)))
    .map(s => s.date).sort().pop() || null;
}
function assessPractice(it) {
  const ev = it.ev || [], lastSeen = ev.map(e => e.date).filter(Boolean).sort().pop() || null;
  const weight = it.fixedWeight != null ? it.fixedWeight : sum(ev.map(e => e.cost * (e.date ? decay(e.date) : 1)));
  let status = it.status || 'active', note = it.note || (lastSeen ? `Last seen ${dateLabel(lastSeen)}.` : '');
  if (!it.status && lastSeen && ageDays(lastSeen) > STALE_AFTER) {
    status = 'quiet'; note = `Last seen ${dateLabel(lastSeen)}, more than six months ago — too old to plan around.`;
  } else if (!it.status && lastSeen && it.kind !== 'strike' && it.kind !== 'swing') {
    const ch = it.chances || [], hits = ch.filter(c => c.hit).length, clean = ch.filter(c => c.date > lastSeen).length;
    const rate = ch.length ? hits / ch.length : 1;
    const needed = rate >= 1 ? 3 : Math.max(3, Math.ceil(Math.log(0.2) / Math.log(1 - rate)));
    const practised = practisedSince(it.block, lastSeen);
    if (ch.length && clean >= needed) { status = 'quiet'; note = `Not seen in ${plural(clean, 'chance')} since ${dateLabel(lastSeen)}; at the old rate (${hits} in ${ch.length}) it would probably have shown up by now.`; }
    else if (practised) { status = 'practised'; note = `Last seen ${dateLabel(lastSeen)}. Worked on at the range ${dateLabel(practised)} — ${clean ? `${plural(clean, 'clean chance')} on course since, not yet enough to call it fixed` : 'not tested on course since'}.`; }
    else if (clean) note = `Last seen ${dateLabel(lastSeen)}; ${plural(clean, 'clean chance')} since, not yet enough to call it fixed.`;
  }
  return { ...it, lastSeen, status, note, weight: weight * (status === 'practised' ? 0.5 : 1) };
}
// What to practise now, ranked; and what has gone quiet.
// A current swing reading about a club that already has a ball-data item
// joins that item as supporting evidence instead of being listed on its
// own: video ranks below ball data, and adds weight (half its own) only
// when it agrees with it.
function rankedPractice() {
  const all = practiceItems().map(assessPractice), byWeight = (a, b) => b.weight - a.weight;
  let now = all.filter(x => x.status !== 'quiet');
  for (const sw of now.filter(x => x.kind === 'swing' && x.club)) {
    const host = now.filter(x => x.kind !== 'swing' && x.block && x.block.club === sw.club).sort(byWeight)[0];
    if (!host) continue;
    host.support = [...(host.support || []), sw];
    if (sw.agrees) host.weight += sw.weight / 2;
    if (sw.drillName) host.block = { ...host.block, intent: `${host.block.intent}. Drill from the video: ${sw.drillName}` };
    now = now.filter(x => x !== sw);
  }
  return { now: now.sort(byWeight), quiet: all.filter(x => x.status === 'quiet').sort(byWeight) };
}

/* ---------- 3. calibration: course distance vs range ---------- */
function calibration() {
  const by = {};
  for (const x of shotRecords().filter(x => x.full && x.club)) (by[x.club] = by[x.club] || []).push(x);
  return Object.entries(by).map(([club, xs]) => {
    const ref = totalRef(club), med = median(xs.map(x => x.len)), n = xs.length;
    // Short shots are plausible mishits. Only shots LONGER than the range allows are suspect data.
    const ceiling = ref ? Math.max(ref.max || 0, ref.v + Math.max(25, 0.25 * ref.v)) : null;
    const suspect = ceiling ? xs.filter(x => x.len > ceiling && !(x.s && x.s.verified)) : [];
    return { club, n, med, ref, delta: ref ? med - ref.v : null, status: n >= 8 ? 'calibrated' : n >= 3 ? 'early' : 'too few', suspect, xs };
  }).sort((a, b) => ((b.ref && b.ref.v) || 0) - ((a.ref && a.ref.v) || 0));
}

/* ---------- views ---------- */
const KIND_LABEL = { tee: 'Off the tee', approach: 'Approach', measure: 'Gapping', strike: 'Strike', short: 'Short game', putting: 'Putting', penalty: 'Penalties', swing: 'Swing video' };
const freshLine = it => it.note ? `<div class="fresh small ${it.status}">${it.status === 'practised' ? '<span class="tag">worked on</span> ' : ''}${esc(it.note)}</div>` : '';
function practiceCard(it, i) {
  const b = it.block;
  // Video readings collapse: they are long, and they rank below ball data.
  if (it.kind === 'swing') return `<details class="pcard k-swing" id="pc-${esc(it.key || i)}">
    <summary><span class="small muted">${i + 1}. ${KIND_LABEL[it.kind]}</span> <b>${esc(it.title)}</b> <span class="tag">read from video</span></summary>
    ${freshLine(it)}<div class="small" style="margin-top:6px">${esc(it.detail)}</div>
    ${it.advice ? `<div class="small" style="margin-top:4px"><b>Video vs numbers:</b> ${esc(String(it.advice).replace(/^Video vs numbers: /, ''))}</div>` : ''}
    ${it.practice ? `<div class="small" style="margin-top:4px"><b>Drill:</b> ${esc(it.practice)}</div>` : ''}
    ${it.range ? `<div class="small muted" style="margin-top:4px">${esc(it.range)}</div>` : ''}
  </details>`;
  return `<div class="pcard k-${it.kind}">
    <div class="spread"><span class="small muted">${i + 1}. ${KIND_LABEL[it.kind]}</span><span class="tag ${it.n >= 12 ? 'green' : ''}">${it.video ? 'read from video' : confidence(it.n) + ', n=' + it.n}</span></div>
    <div class="pt">${esc(it.title)}</div>${freshLine(it)}<div class="small">${esc(it.detail)}</div>
    ${it.range ? `<div class="small muted" style="margin-top:4px">${esc(it.range)}</div>` : ''}
    ${(it.support || []).map(v => `<div class="small" style="margin-top:4px"><span class="tag">read from video</span> ${esc(v.title)}${v.note ? ` <span class="muted">${esc(v.note)}</span>` : ''}${v.agrees ? ' <span class="muted">Agrees with the ball data.</span>' : ''}</div>`).join('')}
    ${it.advice ? `<div class="small" style="margin-top:4px"><b>On course:</b> ${esc(it.advice)}</div>` : ''}
    ${it.practice ? `<div class="small" style="margin-top:4px"><b>Practice:</b> ${esc(it.practice)}</div>` : ''}

// Up to five blocks, one per club and swing, in the order given. A second

function planBlocks(items) {
  const blocks = [];

    const k = it.block.club + '|' + it.block.swing, have = blocks.find(b => b.club + '|' + b.swing === k);
    if (have) { have.reason += `; ${it.title}`; continue; }
    if (blocks.length >= 5) continue;
    blocks.push({ id: uid('b'), seq: blocks.length + 1, club: it.block.club, swing: it.block.swing, target: it.block.target, intent: it.block.intent, reason: it.title, plan: true, shots: [] });
  }

}
Object.assign(ACTIONS, {
  // Plans from what's current across everything — rounds, range strike data,
  // swing readings and unmeasured clubs — in the ranked order, leaving out

    const pending = S.sessions.find(s => s.type === 'range' && s.planned && (s.blocks || []).length && s.blocks.every(b => b.plan));
    if (pending && !await confirmAsk(`You already have a planned session from ${dateLabel(pending.date)} that hasn't been hit. Replace it with this plan?`, 'Replace plan')) return;

    const doc = { ...base, v: SCHEMA_VERSION, date: today(), planned: true, focus: 'Planned from your latest rounds, range sessions and swings', notes, blocks };
    if (await save('sessions', doc.id, doc)) { toast(pending ? 'Plan replaced' : 'Session planned'); go('range', { sessionId: doc.id }); }

/* ============================================================
   Swing analyzer
   A session (range or round) can carry a few swings. Each swing is a
   handful of frames pulled out of a video in the page, plus a view tag:
     dtl    down the line — path, plane, early extension, hosel
     face   face on        — low point, sway/slide, weight, release
     other  anything else  — describe only what the angle supports
   Frames are stored as assets; the video too when it fits. Analysis is
   Claude reading the frames WITH the ball data for that club, so the
   two lines of evidence are weighed together rather than separately.
   ============================================================ */
const VIEWS = { dtl: 'Down the line', face: 'Face on', other: 'Other angle' };
const FRAME_COUNT = 8;

// What each view can actually show. Sent to Claude so it reads the
// frames for what they support, and says so when they don't.
const VIEW_BRIEF = {
  dtl: `DOWN THE LINE (camera behind the ball on the target line). This view shows: shaft plane through takeaway and downswing, club path in to out or out to in, the trail elbow, spine angle and any early extension (hips thrusting toward the ball), the hosel's proximity to the ball, and where the club exits. It does NOT reliably show: low point ahead or behind the ball, weight distribution, or sway toward the target.`,
  face: `FACE ON (camera square to the player, ball in the middle). This view shows: low point relative to the ball, lateral hip sway or slide, weight shift and pressure, head movement, the width of the arc, and release timing through impact. It does NOT reliably show: club path, shaft plane, or hosel position.`,
  other: `AN ANGLE THAT IS NEITHER down the line NOR face on (over the shoulder, in front, from a phone on the ground, or anything oblique). Work out what the angle can honestly support and comment ONLY on that. Say plainly which of the usual checks this angle cannot answer rather than guessing at them.`,
};

const swingsOf = s => (s.swings || []);
const allSwings = () => S.sessions.flatMap(s => swingsOf(s).map(sw => ({ ...sw, session: s })));

/* ---------- frames out of a video, in the page ---------- */
// Frames are individually sized to ~880px, not tiled into one large
// contact sheet: big sheets have failed to render reliably before.
async function extractFrames(file, { start = 0, end = null, count = FRAME_COUNT, onProgress } = {}) {
  const url = URL.createObjectURL(file);
  const vid = document.createElement('video');
  vid.preload = 'auto'; vid.muted = true; vid.playsInline = true; vid.src = url;
  await new Promise((res, rej) => { vid.onloadedmetadata = res; vid.onerror = () => rej(new Error('unreadable')); });
  // Wait for actual picture data. Seeking before this yields blank frames.
  if (vid.readyState < 2) await new Promise(res => { const done = () => { vid.onloadeddata = null; res(); }; vid.onloadeddata = done; setTimeout(done, 1500); });
  const dur = vid.duration && isFinite(vid.duration) ? vid.duration : 0;
  const EPS = 0.05;                                    // never ask for exactly 0
  const a = Math.max(EPS, start), b = Math.min(end == null ? dur : end, dur || 1e9);
  const span = Math.max(0.001, b - a);
  const scale = Math.min(1, 880 / Math.max(vid.videoWidth || 880, vid.videoHeight || 880));
  const w = Math.round((vid.videoWidth || 880) * scale), h = Math.round((vid.videoHeight || 880) * scale);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  // A frame is blank when every sampled pixel is identical (all black, all
  // white, or fully transparent) — the decoder gave us nothing.
  const looksBlank = () => {
    try {
      const d = cx.getImageData(0, 0, w, h).data; let mn = 255, mx = 0, alpha = 0;
      for (let i = 0; i < d.length; i += 4 * 997) { const v = (d[i] + d[i + 1] + d[i + 2]) / 3; if (v < mn) mn = v; if (v > mx) mx = v; alpha = Math.max(alpha, d[i + 3]); }
      return alpha === 0 || mx - mn < 3;
    } catch (e) { return false; }
  };
  const seekTo = t => new Promise((res, rej) => {
    let settled = false;
    const finish = () => { if (settled) return; settled = true; vid.onseeked = null; res(); };
    vid.onseeked = () => { if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(() => finish()); else setTimeout(finish, 60); };
    vid.onerror = () => rej(new Error('seek failed'));
    const target = Math.max(EPS, Math.min(t, Math.max(EPS, (dur || t) - 0.05)));
    if (Math.abs(vid.currentTime - target) < 0.001) { vid.currentTime = target + 0.001; } else { vid.currentTime = target; }
    setTimeout(finish, 1200);                          // a seek that never reports back
  });
  const out = [];
  for (let i = 0; i < count; i++) {
    let t = a + span * (i / (count - 1 || 1));
    let blob = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      await seekTo(t);
      cx.clearRect(0, 0, w, h);
      cx.drawImage(vid, 0, 0, w, h);
      if (!looksBlank()) break;
      t = Math.min(t + 0.12, Math.max(EPS, (dur || t) - 0.05));   // nudge on and try again
      blob = null;
    }
    blob = await new Promise(r => cv.toBlob(r, 'image/webp', 0.85)) || await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    out.push({ blob, t: +t.toFixed(2), blank: looksBlank() });
    if (onProgress) onProgress(i + 1, count);
  }
  URL.revokeObjectURL(url);
  const kept = out.filter(f => !f.blank);              // drop any that stayed blank
  return { frames: kept.length >= 2 ? kept : out, duration: dur, width: w, height: h, dropped: out.length - kept.length };
}

// Everything the app knows about this club's ball flight, in plain text.
function ballContextFor(code) {
  if (!code) return 'No club recorded for this swing.';
  const s = clubStats(code), ref = carryRef(code), tot = totalRef(code);
  if (!s) return `${code}: no shot-level range data yet${ref ? `; ${ref.measured ? 'measured' : 'assumed'} carry about ${fmt(ref.v)}m` : ''}.`;
  const cal = calibration().find(c => c.club === code);
  return [`${code} from ${s.n} tracked range shots:`,
    `stock carry ${fmt(s.stockCarry)}m (median of non-topped full swings), pure-strike carry ${fmt(s.pureCarry)}m, average roll ${fmt(s.roll)}m.`,
    `Strike mix: ${pct(s.pure, s.n)}% pure, ${pct(s.runner, s.n)}% low runners (low launch, long roll), ${pct(s.short, s.n)}% short or fat, ${pct(s.top, s.n)}% topped.`,
    tot && tot.measured ? `Stock total ${fmt(tot.v)}m.` : '',
    cal && cal.n ? `On course this club has measured ${fmt(cal.med)}m over ${cal.n} full swings.` : '',

}
function swingPrompt(sw, session) {
  const changes = S.sessions.length ? '' : '';
  const focus = session.focus ? `The player's stated focus for this session was: "${session.focus}".` : '';
  const hist = `Background on the player: a beginner roughly a year in, working on iron consistency and course management. Known history: lateral hip sway on the backswing and early extension through impact were early faults; adding hip rotation gained distance but introduced an alternating hook and shank pattern on irons, thought to be body rotation outrunning hand and arm timing.`;
  return `You are looking at ${FRAME_COUNT} still frames taken in order from a single golf swing, earliest first. They were pulled from a phone video, so they are evenly spaced in time and may not land exactly on the key positions.

CAMERA VIEW: ${VIEW_BRIEF[sw.view] || VIEW_BRIEF.other}

CLUB AND BALL DATA: ${ballContextFor(sw.club)}
${focus}
${sw.note ? `The player's own note on this swing: "${sw.note}"` : ''}

${hist}

Read the frames and answer as JSON with exactly these keys:
{
  "positions": [ { "frame": 1, "what": "one short line on what this frame shows" } ],
  "observations": [ { "what": "one specific thing you can see", "evidence": "which frame(s) and what in them shows it", "confidence": "high" | "medium" | "low" } ],
  "matches_ball_data": "one or two sentences: does what you see line up with the strike mix above, contradict it, or neither? Say which.",
  "cannot_tell": ["things this camera angle or frame spacing cannot answer"],
  "drill": { "name": "one drill", "why": "one line tying it to what you saw" },
  "one_thing": "the single change you would make, in one sentence a golfer can act on"
}

Be specific and restrained. Only claim what the frames support; put anything you are unsure of at low confidence or in cannot_tell. Do not invent measurements or angles. Prefer "I cannot see that from here" over a guess.`;
}
async function analyseSwing(sessionId, swingId, onText) {
  const s = session(sessionId), sw = swingsOf(s).find(x => x.id === swingId);
  if (!sw) return { error: 'gone' };
  const sample = await claude.use('sample');
  if (!sample) return { error: 'unavailable' };
  // limits() can under-report; attempt the call and let it reject rather
  // than refusing up front.
  const lim = await sample.limits().catch(() => null);
  const max = Math.max(1, Math.min((lim && lim.images && lim.images.maxCount) || 4, sw.frames.length));
  const pick = sw.frames.length <= max ? sw.frames : Array.from({ length: max }, (_, i) => sw.frames[Math.round(i * (sw.frames.length - 1) / (max - 1))]);
  let blobs;
  try { blobs = await Promise.all(pick.map(async f => { const r = await fetch('/_blob/' + f.asset); if (!r.ok) throw new Error('fetch'); return r.blob(); })); }
  catch (e) { return { error: 'frames_unreadable' }; }
  try {
    const data = await sample.json(swingPrompt({ ...sw, frames: pick }, s), { images: blobs, modelTier: 'complex', onText });
    return { data };
  } catch (e) { return { error: e && e.code ? e.code : 'failed', text: e && e.text }; }
}

/* ---------- into the loop ---------- */
// A swing reading is evidence, not measurement: it ranks below anything
// derived from ball flight, and only rises when the two agree.
function swingItems() {
  const items = [], latest = {};
  // A newer reading of the same club from the same angle supersedes an older one.
  const when = sw => sw.analysedOn || sw.session.date || '';
  for (const sw of allSwings().filter(sw => sw.analysis)) { const k = (sw.club || '') + '|' + sw.view; if (!latest[k] || when(sw) > when(latest[k])) latest[k] = sw; }
  for (const sw of Object.values(latest)) {
    const a = sw.analysis;
    const strong = (a.observations || []).filter(o => o.confidence === 'high');
    if (!strong.length && !a.one_thing) continue;
    const cs = sw.club ? clubStats(sw.club) : null;
    const agrees = /line[s]? up|matches|consistent|agree/i.test(a.matches_ball_data || '') && !/not|doesn't|does not|contradict/i.test(a.matches_ball_data || '');
    const score = (agrees ? 0.9 : 0.45) * (strong.length || 1), date = when(sw) || null;
    items.push({ key: 'swing:' + (sw.club || '') + ':' + sw.view, kind: 'swing', n: strong.length || 1, score, ev: [{ date, cost: score }],
      note: date ? `Read ${dateLabel(date)}.` : '',
      title: `${VIEWS[sw.view] || 'Swing'}${sw.club ? ' · ' + sw.club : ''}: ${a.one_thing || strong[0].what}`,
      detail: strong.slice(0, 2).map(o => `${o.what} (${o.evidence})`).join('; ') || (a.observations || [])[0]?.what || '',
      range: cs ? `Ball data for ${sw.club}: ${pct(cs.pure, cs.n)}% pure, ${pct(cs.runner, cs.n)}% low runners` : null,
      advice: a.matches_ball_data ? `Video vs numbers: ${a.matches_ball_data}` : null,
      practice: a.drill ? `${a.drill.name} — ${a.drill.why || ''}` : null,
      block: sw.club && a.drill && a.drill.name ? { club: sw.club, swing: 'full', target: cs && cs.stockCarry ? round5(cs.stockCarry) : null, intent: `Drill: ${a.drill.name}` } : null,
      video: true, session: sw.session, club: sw.club || null, agrees, drillName: (a.drill && a.drill.name) || null });
  }
  return items;
}

/* ============================================================
   Range shots from screenshots
   Typing a 40-shot block by hand is slow and error-prone. Instead he
   drops in screenshots of the bay's shot list; Claude reads them into
   blocks; he checks every number in a review sheet against the images
   before anything is saved. The screenshots are kept with the blocks,
   so each number still traces back to what the bay showed.
   What's read is never trusted silently:
     - units: converted only when the screen says yards; if it doesn't
       say, nothing is converted and the review sheet says so
     - anything Claude marks unclear, out of range, or with total < carry
       is listed as a warning next to the block
     - a club that isn't clearly one of his is left unpicked
   ============================================================ */
const SHOT_IMAGES_MAX = 6;
const YD_TO_M = 0.9144;

// Large photos are shrunk to the API's working size; screenshots that are
// already small enough go as they are. Anything the page can't decode
// (or no canvas at all) is sent untouched.
async function shrinkImage(file, maxEdge = 1568) {
  try {
    const cv = document.createElement('canvas'), cx = cv.getContext && cv.getContext('2d');
    if (!cx) return file;
    const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('unreadable')); im.src = u; });
    const k = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
    if (k === 1 && file.size <= 4.5 * 1024 * 1024 && /^image\/(png|jpeg|webp)$/.test(file.type)) return file;
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    return (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9))) || file;
  } catch (e) { return file; }
}

function shotImagePrompt(n) {
  const bag = activeClubs().filter(c => c.category !== 'putter').map(c => `${c.code} = ${c.name}${c.loft ? ` (${c.loft}°)` : ''}`).join('; ');
  return `${n === 1 ? 'This image is a screenshot or photo' : `These ${n} images are screenshots or photos`} of a golf range bay's shot data (Toptracer, Inrange, Trackman or similar), in order.

Read every shot you can see and answer as JSON with exactly these keys:
{
  "units": "m" | "yd" | "unknown",
  "blocks": [
    {
      "club": "a code from the bag list below, or null",
      "clubAsShown": "the club exactly as the screen shows it, or null",
      "target": number or null,
      "shots": [ { "carry": number, "total": number or null, "clubSpeedMph": number or null, "unclear": true or false } ],
      "summary": { "n": number, "avgCarry": number, "avgTotal": number, "fromPinCarry": number, "fromPinTotal": number } or null
    }
  ],
  "notes": "one or two sentences on anything that affects how these numbers should be read, or empty",
  "unreadable": ["things you could see but could not read"]
}

Rules:
- Copy numbers exactly as displayed. Never estimate, average, interpolate or fill in a missing value.
- If a value is cut off, blurred or covered, give your best reading with "unclear": true, or leave the shot out and say so in "unreadable".
- "units" is what the screen itself says (m, metres, yd, yds, yards). If it doesn't say, use "unknown" — do not guess from the size of the numbers.
- carry and total are distances. Do not confuse them with ball speed, height, apex, launch angle, curve, side or offline.
- clubSpeedMph only when the screen labels a value as club speed in mph. Ball speed is not club speed.
- One block per club (and per target, if the screen groups shots by target). Shots that appear in two screenshots because of scrolling overlap are listed once.
- The golfer's bag: ${bag || 'not recorded'}. Set "club" only when the screen's club is clearly one of these; otherwise null, with "clubAsShown" saying what the screen showed.
- "summary" only when the screen shows averages or from-pin figures; include only the fields it shows.
- Keep shots in the order the screen lists them.`;
}

// Claude's reading → blocks the review sheet can show. Pure: no I/O.
function normaliseShotRead(raw) {
  const units = ['m', 'yd'].includes(raw && raw.units) ? raw.units : 'unknown';
  const k = units === 'yd' ? YD_TO_M : 1;
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v)) ? Number(v) : null);
  const conv = v => { const n = num(v); return n == null ? null : Math.round(n * k * 10) / 10; };
  const blocks = (Array.isArray(raw && raw.blocks) ? raw.blocks : []).map(b => {
    const warnings = [], shots = [];
    const club = b && typeof b.club === 'string' && clubBy(b.club) && !clubBy(b.club).retired ? b.club : null;
    (Array.isArray(b && b.shots) ? b.shots : []).forEach((sh, i) => {
      const carry = conv(sh && sh.carry), total = conv(sh && sh.total);
      if (carry == null || total == null) { warnings.push(`Shot ${i + 1} left out: ${carry == null ? 'no carry' : 'no total'} could be read.`); return; }
      if (carry <= 0 || carry > 350 || total > 400) { warnings.push(`Shot ${i + 1} left out: ${fmt(carry, 1)} / ${fmt(total, 1)}m isn't a plausible range shot.`); return; }
      const out = { carry, total }; const sp = num(sh.clubSpeedMph); if (sp != null && sp > 0 && sp < 160) out.speed = sp;
      shots.push(out);
      const n = shots.length;
      if (sh.unclear) warnings.push(`Shot ${n} (${fmt(carry, 1)} / ${fmt(total, 1)}) was hard to read.`);
      if (total < carry) warnings.push(`Shot ${n}: total ${fmt(total, 1)} is less than carry ${fmt(carry, 1)}.`);
    });
    let summary = null;
    if (b && b.summary && typeof b.summary === 'object') {
      summary = {};
      for (const key of ['avgCarry', 'avgTotal', 'fromPinCarry', 'fromPinTotal']) { const v = conv(b.summary[key]); if (v != null) summary[key] = v; }
      const n = num(b.summary.n); if (n != null) summary.n = n;
      if (!Object.keys(summary).length) summary = null;
    }
    if (!club) warnings.push(b && b.clubAsShown ? `Club shown as "${b.clubAsShown}" — pick which of yours it was.` : 'No club could be read — pick one.');
    const target = conv(b && b.target);
    return { club, clubAsShown: (b && b.clubAsShown) || null, target: target == null ? null : Math.round(target), shots, summary, warnings };
  }).filter(b => b.shots.length || b.summary);
  return { units, converted: units === 'yd', notes: (raw && typeof raw.notes === 'string' && raw.notes) || '', unreadable: Array.isArray(raw && raw.unreadable) ? raw.unreadable.map(String) : [], blocks };
}

async function readShotImages(files) {
  const sample = await claude.use('sample');
  if (!sample) return { error: 'unavailable' };
  const images = []; for (const f of files) images.push(await shrinkImage(f));
  try {
    const raw = await sample.json(shotImagePrompt(images.length), { images, maxTokens: 12000 });
    return { read: normaliseShotRead(raw), images };
  } catch (e) { return { error: (e && e.code) || 'failed' }; }
}

const SHOT_READ_ERRORS = {
  unavailable: "Reading screenshots needs Claude, and this server can't reach it — check ANTHROPIC_API_KEY on the server.",
  rate_limited: 'Too many requests just now — wait a moment and try again.',
  invalid_json: 'Claude replied, but not in the expected format. Try again.',
};

function openShotReview(sid, read, images) {
  const clubs = [['', '— pick a club —']].concat(activeClubs().filter(c => c.category !== 'putter').map(c => [c.code, c.code + '  ' + c.name]));
  const previews = images.map(b => URL.createObjectURL(b));
  const smF = (i, key, label, v) => field(label, `sm_${key}_${i}`, 'number', v, 'step="0.1"');
  openSheet(`<h2>Check the shots</h2>
    <div class="notice">Read from ${plural(images.length, 'screenshot')} by Claude — a reading, not a measurement. Check each block against the images before saving; fix or delete any line here. Nothing is saved until you do.</div>
    ${read.converted ? `<div class="notice">The screen shows yards, so every distance here has been converted to metres (× 0.9144).</div>` : ''}
    ${read.units === 'unknown' ? `<div class="notice warn">The screenshots don't say whether these are metres or yards. They're shown exactly as read. If they're yards, cancel and convert them, or fix them below.</div>` : ''}
    <div class="shotimgs">${previews.map((u, i) => `<img src="${u}" alt="screenshot ${i + 1}">`).join('')}</div>
    ${read.notes ? `<p class="small muted">${esc(read.notes)}</p>` : ''}
    ${read.unreadable.length ? `<p class="small" style="color:var(--flag)">Couldn't read: ${esc(read.unreadable.join('; '))}</p>` : ''}
    ${read.blocks.map((b, i) => `<div class="readblock">
      ${checkF(`<b>Block ${i + 1}</b>${b.clubAsShown ? ` <span class="muted small">screen says “${esc(b.clubAsShown)}”</span>` : ''}`, `keep_${i}`, true)}
      <div class="grid3">${selectF('Club', `club_${i}`, clubs, b.club || '')}${selectF('Swing', `swing_${i}`, [['full', 'Full'], ['part', 'Part'], ['chip', 'Chip']], 'full')}${field('Target m', `target_${i}`, 'number', b.target, 'inputmode="decimal"')}</div>
      <label>Shots — carry, total, speed<textarea name="shots_${i}" spellcheck="false">${esc(shotsText(b.shots))}</textarea></label>
      <div class="count" data-count="${i}"></div>
      ${b.summary ? `<div class="grid3">${field('Shots', `sm_n_${i}`, 'number', b.summary.n)}${smF(i, 'fromPinCarry', 'From pin (carry)', b.summary.fromPinCarry)}${smF(i, 'fromPinTotal', 'From pin (total)', b.summary.fromPinTotal)}</div><div class="grid2">${smF(i, 'avgCarry', 'Avg carry', b.summary.avgCarry)}${smF(i, 'avgTotal', 'Avg total', b.summary.avgTotal)}</div>` : ''}
      ${b.warnings.length ? `<ul class="warnlist">${b.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    </div>`).join('')}`,
    async root => {
      const s = session(sid); if (!s) { toast('Session not found'); return false; }
      const nb = [];
      for (let i = 0; i < read.blocks.length; i++) {
        if (!val(root, `keep_${i}`)) continue;
        const club = val(root, `club_${i}`);
        if (!club) { toast(`Pick a club for block ${i + 1}, or untick it`); return false; }
        const shots = parseShots(val(root, `shots_${i}`) || '');
        const sm = {}; for (const key of ['n', 'avgCarry', 'avgTotal', 'fromPinCarry', 'fromPinTotal']) { const v = val(root, `sm_${key}_${i}`); if (v != null) sm[key] = v; }
        if (shots.length) { delete sm.n; delete sm.avgCarry; delete sm.avgTotal; }   // derived from shots
        const summary = Object.keys(sm).length ? sm : null;
        if (!shots.length && !summary) { toast(`Block ${i + 1} has no shots left — untick it or add them`); return false; }
        nb.push({ club, swing: val(root, `swing_${i}`) || 'full', target: val(root, `target_${i}`), shots, summary });
      }
      if (!nb.length) { toast('Nothing ticked to save'); return false; }
      if (!S.assets) { toast('Saving needs write access to this page'); return false; }
      const assets = [];
      for (const img of images) {
        try { assets.push((await S.assets.upload(img, { type: img.type || 'image/jpeg' })).id); }
        catch (e) { releaseAssets(assets); toast('Storing the screenshots failed — nothing saved'); return false; }
      }
      const fromImages = { assets, readOn: today(), units: read.units, converted: read.converted };
      const seq0 = (s.blocks || []).reduce((m, b) => Math.max(m, b.seq || 0), 0);
      const blocks = (s.blocks || []).concat(nb.map((b, j) => ({ id: uid('b'), seq: seq0 + j + 1, ...b, fromImages })));
      const ok = await save('sessions', s.id, { ...s, blocks });
      if (!ok) { releaseAssets(assets); return false; }
      previews.forEach(u => URL.revokeObjectURL(u));
      go('range', { sessionId: s.id });
      return true;
    });
  const upd = () => read.blocks.forEach((_, i) => { const ta = sheetInner.querySelector(`[name=shots_${i}]`), out = sheetInner.querySelector(`[data-count="${i}"]`); const p = parseShots(ta.value); out.textContent = p.length ? `${plural(p.length, 'shot')}, avg carry ${fmt(mean(p.map(x => x.carry)), 1)}m, avg total ${fmt(mean(p.map(x => x.total)), 1)}m` : 'No shots.'; });
  sheetInner.addEventListener('input', e => { if (/^shots_/.test(e.target.name || '')) upd(); });
  upd();
}

// Assets a block or a whole session points at, and letting them go.
const blockAssets = b => (b && b.fromImages && b.fromImages.assets) || [];
const sessionAssets = s => [...(s.blocks || []).flatMap(blockAssets), ...(s.swings || []).flatMap(sw => [...(sw.frames || []).map(f => f.asset), ...(sw.video ? [sw.video] : [])])];
async function releaseAssets(ids) { if (!S.assets) return; for (const id of ids || []) { try { await S.assets.delete(id); } catch (e) {} } }

ACTIONS.shotsFromImages = function (d) {
  const sid = d.id;
  openSheet(`<h2>Shots from screenshots</h2>
    <p class="small muted">Screenshots or photos of the bay's shot list — up to ${SHOT_IMAGES_MAX}, in order. Claude reads them into blocks, one per club; you check every number before anything is saved.</p>
    <label>Screenshots<input type="file" accept="image/*" multiple name="imgs"></label>
    <div class="count" id="readNote"></div>`,
    async root => {
      const files = [...(root.querySelector('[name=imgs]').files || [])];
      const note = $('#readNote', root);
      if (!files.length) { toast('Pick at least one screenshot'); return false; }
      if (files.length > SHOT_IMAGES_MAX) { toast(`Up to ${SHOT_IMAGES_MAX} at a time`); return false; }
      note.textContent = `Reading ${plural(files.length, 'screenshot')}…`;
      const res = await readShotImages(files);
      if (res.error) { note.textContent = SHOT_READ_ERRORS[res.error] || `Reading failed (${res.error}).`; return false; }
      if (!res.read.blocks.length) { note.textContent = `No shots could be read from ${files.length === 1 ? 'that image' : 'those images'}.${res.read.unreadable.length ? ' ' + res.read.unreadable.join('; ') : ''}`; return false; }
      sheet.close();
      openShotReview(sid, res.read, res.images);
      return false;
    });
};

/* ============================================================
   v1 additions
   Export/import (the whole store, images included), a settings
   document, course distances from a home location, verification of
   flagged taps, and the freshness line behind "what to practise".
   ============================================================ */
const SETTINGS_ID = 'app';
const settings = () => S.settings || {};
const home = () => settings().home || null;

/* ---------- distance ---------- */
const hasCoords = c => c && typeof c.lat === 'number' && typeof c.lng === 'number';
function kmBetween(a, b) {                       // straight line, not drive time
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function distanceTo(c) {
  const h = home(); if (!h || !hasCoords(h) || !hasCoords(c)) return null;
  return kmBetween(h, c);
}
const distanceLabel = c => { const d = distanceTo(c); return d == null ? '' : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`; };

/* ---------- verifying a flagged tap ---------- */
// A long shot can be real (a bladed wedge runs forever). Marking it real
// keeps it in the numbers and stops it being flagged again.
ACTIONS.verifyShot = async function (d) {
  const r = session(d.sid); if (!r) return;
  const n = Number(d.n), i = Number(d.i);
  const holes = (r.holes || []).map(h => h.n !== n ? h : { ...h, shots: (h.shots || []).map((s, j) => j === i ? { ...s, verified: true } : s) });
  if (await save('sessions', r.id, { ...r, holes })) { toast('Marked as a real shot'); render(); }
};

/* ---------- freshness: what the practice list is standing on ---------- */
function practiceBasis() {
  const rounds = S.sessions.filter(s => s.type === 'round');
  const shotHoles = rounds.flatMap(r => (r.holes || []).filter(h => (h.shots || []).length).map(h => ({ r, h })));
  const ranges = S.sessions.filter(s => s.type === 'range');
  const rangeShots = ranges.reduce((n, s) => n + (s.blocks || []).reduce((m, b) => m + (b.shots || []).length, 0), 0);
  const swings = allSwings().filter(s => s.analysis);
  const dates = [...shotHoles.map(x => x.r.date), ...ranges.filter(s => (s.blocks || []).some(b => (b.shots || []).length || b.summary)).map(s => s.date), ...swings.map(s => s.session.date)].filter(Boolean).sort();
  const newest = dates[dates.length - 1];
  const parts = [];
  if (shotHoles.length) parts.push(`${plural(shotHoles.length, 'hole')} of shot data`);
  if (rangeShots) parts.push(`${rangeShots} range shots`);
  if (swings.length) parts.push(`${plural(swings.length, 'analysed swing')}`);
  if ((rounds.length - new Set(shotHoles.map(x => x.r.id)).size) > 0) parts.push(`${rounds.length - new Set(shotHoles.map(x => x.r.id)).size} scorecard-only rounds (not used)`);
  return { text: parts.length ? `Built from ${parts.join(', ')}.` : 'Nothing to build from yet.', newest, count: shotHoles.length + rangeShots + swings.length };
}
const basisLine = () => { const b = practiceBasis(); return `<div class="basis">${esc(b.text)}${b.newest ? ` Newest input ${dateLabel(b.newest)}.` : ''} <span class="muted">Recalculated every time this screen draws — there is no stored copy.</span></div>`; };

const EXPORT_VERSION = 1;
function collectAssetIds() {
  const ids = new Set();
  for (const c of S.courses) for (const h of (c.holes || [])) if (h.art && h.art.asset) ids.add(h.art.asset);
  for (const s of S.sessions) for (const id of sessionAssets(s)) ids.add(id);
  return [...ids];
}
const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(b); });
async function buildExport({ withImages = true, onProgress } = {}) {
  const out = { format: 'carry-export', version: EXPORT_VERSION, exportedAt: new Date().toISOString(), appVersion: APP.version,
    clubs: S.clubs, courses: S.courses, sessions: S.sessions, settings: settings(), assets: {} };
  if (withImages) {
    const ids = collectAssetIds();
    for (let i = 0; i < ids.length; i++) {
      if (onProgress) onProgress(i + 1, ids.length);
      try { const r = await fetch('/_blob/' + ids[i]); if (!r.ok) continue; const b = await r.blob(); const d = await blobToDataUrl(b); if (d) out.assets[ids[i]] = d; } catch (e) {}
    }

}
const dataUrlToBlob = async d => (await fetch(d)).blob();
async function applyImport(data, { onProgress } = {}) {
  if (!data || data.format !== 'carry-export') throw new Error('Not a Carry export file');
  const map = {};                                   // old asset id -> new asset id
  const ids = Object.keys(data.assets || {});
  if (ids.length && S.assets) {

      if (onProgress) onProgress('images', i + 1, ids.length);

    }
  }
  const remap = id => map[id] || id;
  const courses = (data.courses || []).map(c => ({ ...c, holes: (c.holes || []).map(h => h.art && h.art.asset ? { ...h, art: { ...h.art, asset: remap(h.art.asset) } } : h) }));
  const sessions = (data.sessions || []).map(s => ({ ...s, swings: (s.swings || []).map(sw => ({ ...sw, frames: (sw.frames || []).map(f => ({ ...f, asset: remap(f.asset) })), video: sw.video ? remap(sw.video) : null })),
    ...(s.blocks ? { blocks: s.blocks.map(b => b.fromImages ? { ...b, fromImages: { ...b.fromImages, assets: (b.fromImages.assets || []).map(remap) } } : b) } : {}) }));
  const counts = { clubs: 0, courses: 0, sessions: 0 };
  for (const c of (data.clubs || [])) { if (await save('clubs', c.code, c)) counts.clubs++; onProgress && onProgress('clubs', counts.clubs, (data.clubs || []).length); }
  for (const c of courses) { if (await save('courses', c.id, c)) counts.courses++; onProgress && onProgress('courses', counts.courses, courses.length); }
  for (const s of sessions) { if (await save('sessions', s.id, s)) counts.sessions++; onProgress && onProgress('sessions', counts.sessions, sessions.length); }

}

/* ============================================================
   v1, part two
   Tee sets, editing a shot after the fact, first-putt distance,
   penalties attached to the shot that caused them, a recency window
   on range numbers, and a versioned schema with migrations.
   ============================================================ */
const SCHEMA_VERSION = 2;

/* ---------- tee sets ----------
   A course hole carries `tees: { white: 297, blue: 310 }` and a mirror
   `metres` for the course's primary tee. A round records which tee was
   played, and every distance downstream resolves through it. */
const teeNames = c => { const s = new Set(); for (const h of (c && c.holes) || []) for (const k of Object.keys(h.tees || {})) s.add(k); if (!s.size && c && c.teeName) s.add(c.teeName); return [...s]; };
const primaryTee = c => (c && c.tee) || teeNames(c)[0] || 'default';
function teeMetres(hole, tee) {
  if (!hole) return null;
  if (tee && hole.tees && hole.tees[tee] != null) return hole.tees[tee];
  return hole.metres ?? null;
}
// Course holes resolved for one tee, so the rest of the app keeps reading `metres`.
const holesForTee = (c, tee) => (c && c.holes || []).map(h => ({ ...h, metres: teeMetres(h, tee || primaryTee(c)) }));

/* ---------- migrations ----------
   Runs once per document, in the page, and writes the upgraded shape
   back. Keep every step idempotent: it will run against documents that
   are already current. */
function migrateCourse(c) {
  if ((c.v || 0) >= SCHEMA_VERSION) return null;
  const tee = c.tee || c.teeName || 'white';
  const holes = (c.holes || []).map(h => h.tees ? h : { ...h, tees: h.metres == null ? {} : { [tee]: h.metres } });
  return { ...c, v: SCHEMA_VERSION, tee, holes };
}
function migrateSession(s) {
  if ((s.v || 0) >= SCHEMA_VERSION) return null;
  if (s.type !== 'round') return { ...s, v: SCHEMA_VERSION };
  const c = course(s.courseId);
  return { ...s, v: SCHEMA_VERSION, tee: s.tee || (c ? primaryTee(c) : null) };
}
let migrating = false;
async function runMigrations() {
  if (migrating || !S.db) return;
  migrating = true;
  try {
    for (const c of S.courses) { const up = migrateCourse(c); if (up) await save('courses', c.id, up); }
    for (const s of S.sessions) { const up = migrateSession(s); if (up) await save('sessions', s.id, up); }
  } finally { migrating = false; }
}

/* ---------- recency window ---------- */
const WINDOWS = [['all', 'All time'], ['365', 'Last 12 months'], ['180', 'Last 6 months'], ['90', 'Last 90 days']];
const windowDays = () => { const w = (settings().window || 'all'); return w === 'all' ? null : Number(w); };
function withinWindow(date) {
  const d = windowDays(); if (!d || !date) return true;
  const age = (Date.now() - new Date(date + 'T00:00:00').getTime()) / 86400000;
  return age <= d;
}
ACTIONS.setWindow = async function (d) {
  await save('settings', SETTINGS_ID, { ...settings(), id: SETTINGS_ID, window: d.w });
  render();
};
ACTIONS.setWeighting = async function (d) { await save('settings', SETTINGS_ID, { ...settings(), id: SETTINGS_ID, weighting: d.v }); render(); };

};

  const summary = [(WINDOWS.find(w => w[0] === (settings().window || 'all')) || WINDOWS[0])[1], weighting() === 'recent' ? 'recent shots count more' : 'every shot the same',
    (BALLS.find(b => b[0] === ballFilter()) || BALLS[0])[1].toLowerCase()].concat(left ? [`${left} left out`] : []).join(' · ');
  return `<details class="sec filters" id="rangeFilter"><summary><b>Range numbers:</b> <span class="small">${esc(summary)}</span></summary>

    <p class="small muted">Recent shots: a shot ${DISTANCE_HALF_LIFE} days old counts half as much as one from today, so a swing change shows up without deleting anything.</p>
    <label>Balls</label>${chips('setBalls', 'v', BALLS, ballFilter())}
    ${noBall && ballFilter() !== 'all' ? `<p class="small muted">${plural(noBall, 'session')} didn't record the ball type, so only counts under All balls.</p>` : ''}

  </details>`;
}

/* ---------- putting stats, now that distance exists ---------- */
function puttingStats() {
  const holes = S.sessions.filter(s => s.type === 'round').flatMap(r => holesOf(r).filter(h => h.putts != null).map(h => ({ r, h })));
  const withDist = holes.filter(x => x.h.firstPutt != null);
  if (!holes.length) return null;
  return {
    holes: holes.length, putts: sum(holes.map(x => x.h.putts)),
    perHole: sum(holes.map(x => x.h.putts)) / holes.length,
    threes: holes.filter(x => x.h.putts >= 3).length,
    measured: withDist.length, estimated: withDist.filter(x => x.h.firstPuttEstimated).length,
    medianFirst: withDist.length ? median(withDist.map(x => x.h.firstPutt)) : null,
    onePuttRate: withDist.length ? pct(withDist.filter(x => x.h.putts === 1).length, withDist.length) : null,
  };
}

/* ============================================================
   Faster logging
   Fewer taps per hole, without guessing on the golfer's behalf:
   - the club is armed BEFORE the tap, defaulting to what he usually
     hits from that distance (his own history, not a recommendation)
   - putts are one tap, not a stepper
   - first-putt distance is derived from the approach tap when it
     finished on the green, flagged as an estimate
   - holes he doesn't want to trace get a one-tap score
   ============================================================ */

// What he actually hits from around this distance — descriptive, from his
// own logs. Deliberately not the club the app would recommend: the loop
// must not end up grading its own advice.
function usualClubFor(dist, courseId) {
  if (dist == null) return null;
  const near = shotRecords().filter(x => x.club && x.from != null && Math.abs(x.from - dist) <= 15);
  if (!near.length) return null;
  const here = near.filter(x => x.r.courseId === courseId);
  const pool = here.length >= 2 ? here : near;
  const counts = {};
  for (const x of pool) counts[x.club] = (counts[x.club] || 0) + 1;
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] >= 2 ? { club: best[0], n: best[1], scope: here.length >= 2 ? 'here' : 'anywhere' } : null;
}
function armedClubFor(h, distLeft) {
  if (S.armed && S.armed.hole === h.n) return S.armed.club;
  const shots = h.shots || [];
  // Tee shot on a two-shot hole: the driver, or the longest club in the bag
  // if there isn't one.
  if (!shots.length && h.par >= 4) {
    const d = clubBy('D');
    if (d && !d.retired) return 'D';
    const longest = activeClubs().filter(c => c.category !== 'putter')
      .sort((a, b) => (b.nominalTotal || b.nominalCarry || 0) - (a.nominalTotal || a.nominalCarry || 0))[0];
    return longest ? longest.code : null;
  }
  const usual = usualClubFor(distLeft, S.sub && S.sub.sessionId ? (session(S.sub.sessionId) || {}).courseId : null);
  return (usual && usual.club) || (shots.length ? shots[shots.length - 1].club : null);
}
Object.assign(ACTIONS, {
  armClub(d) { S.armed = { hole: Number(d.n), club: d.club }; render(); },
  async setPutts(d) {
    const r = session(d.sid);
    if (await updateHole(r, Number(d.n), h => { h.putts = Number(d.p); })) render();
  },
  async quickScore(d) {
    const r = session(d.sid), n = Number(d.n), v = Number(d.s);
    const h = (r.holes || []).find(x => x.n === n);
    if ((h.shots || []).length) { toast('This hole has shots traced — edit those instead'); return; }
    if (await updateHole(r, n, hh => { hh.manualStrokes = v; hh.strokes = v; })) render();
  },
});

// Chips for arming the next club, with the reason attached.
function clubArmRow(r, h, distLeft) {
  const clubs = activeClubs().filter(c => c.category !== 'putter');
  if (!clubs.length) return '';
  const armed = armedClubFor(h, distLeft);
  const usual = usualClubFor(distLeft, r.courseId);
  return `<div class="armrow">
    <div class="small muted">Next shot${armed ? `: <b>${esc(armed)}</b>` : ''}${usual && usual.club === armed ? ` — what you usually hit from about ${fmt(distLeft)}m${usual.scope === 'here' ? ' on this course' : ''} (${usual.n}×)` : ''}</div>
    <div class="chips">${clubs.map(c => `<button class="chip" data-act="armClub" data-n="${h.n}" data-club="${esc(c.code)}" aria-pressed="${armed === c.code}">${esc(c.code)}</button>`).join('')}</div>
  </div>`;
}
const puttRow = (r, h) => `<div class="armrow"><div class="small muted">Putts${h.putts != null ? `: <b>${h.putts}</b>` : ''}</div>
  <div class="chips">${[0, 1, 2, 3, 4, 5].map(p => `<button class="chip" data-act="setPutts" data-sid="${r.id}" data-n="${h.n}" data-p="${p}" aria-pressed="${h.putts === p}">${p}</button>`).join('')}</div></div>`;

// One-tap scores for holes he isn't tracing.
function quickScoreSection(r) {
  const holes = holesOf(r);
  const untraced = holes.filter(h => !(h.shots || []).length);
  if (!untraced.length) return '';
  return `<details class="sec" id="quickScore"><summary><b>Quick score</b> <span class="small muted">— ${plural(untraced.length, 'hole')} without shots, one tap each</span></summary>
    <div class="quick">${untraced.map(h => `<div class="qrow"><span class="qn">${h.n}<small>par ${h.par ?? '–'}</small></span>
      <div class="chips">${(h.par ? [h.par - 1, h.par, h.par + 1, h.par + 2, h.par + 3, h.par + 4] : [3, 4, 5, 6, 7, 8]).filter(v => v > 0).map(v => `<button class="chip" data-act="quickScore" data-sid="${r.id}" data-n="${h.n}" data-s="${v}" aria-pressed="${h.strokes === v}">${v}</button>`).join('')}</div></div>`).join('')}</div>
    <p class="small muted">Par is highlighted for reference — tap the score you made. Holes with traced shots aren't listed; their score comes from the shots.</p></details>`;
}

/* ---------- start ---------- */
connect();

</script>
</body>
</html>
