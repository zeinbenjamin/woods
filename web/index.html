<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">

<title>Carry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* No double-tap zoom (pinch-to-zoom still works); inputs at 16px, because iOS zooms into anything smaller. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #F7F8F5; --paper-2: #ECEFE9; --ink: #1B2A20; --ink-2: #4A5A4F; --ink-3: #7E8B82;
  --rule: #D3DAD1; --green: #2E6B3F; --green-2: #1F4F2E; --green-soft: #D6E6DA; --fw: #4E9A62; --rough: #B9D3BF;
  --flag: #C8432A; --flag-soft: #F7DED8; --sand: #E3D6A9; --sand-2: #CDB36A; --water: #8FBEDD; --focus: #2E6B3F;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r: 8px; --nav-h: 56px;
  /* The home-indicator strip under the tab bar (about 34px on an iPhone). The

  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10170F; --paper-2: #182119; --ink: #E6ECE5; --ink-2: #AAB6AC; --ink-3: #77857A; --rule: #29352C;
  --green: #6DB37F; --green-2: #9BD3A8; --green-soft: #1E3A27; --fw: #3E7A4E; --rough: #24402C;
  --flag: #E5674C; --flag-soft: #46231C; --sand: #7A6B3A; --sand-2: #A88F4A; --water: #3E6E8C; --focus: #6DB37F; } }
:root[data-theme="dark"] {
  --paper: #10170F; --paper-2: #182119; --ink: #E6ECE5; --ink-2: #AAB6AC; --ink-3: #77857A; --rule: #29352C;
  --green: #6DB37F; --green-2: #9BD3A8; --green-soft: #1E3A27; --fw: #3E7A4E; --rough: #24402C;
  --flag: #E5674C; --flag-soft: #46231C; --sand: #7A6B3A; --sand-2: #A88F4A; --water: #3E6E8C; --focus: #6DB37F; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 10px; }
.brand { font-family: var(--cond); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
button.brand { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; border-radius: 4px; }
.brand small { font: 500 11px var(--body); color: var(--ink-3); margin-left: 5px; letter-spacing: 0; }
.vlist { list-style: none; margin: 8px 0 0; padding: 0; } .vlist li { border-top: 1px solid var(--rule); padding: 10px 0; } .vlist ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; } .vlist ul li { border: 0; padding: 2px 0; }
.status { font-size: 12px; color: var(--ink-3); } .status.err { color: var(--flag); }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + var(--safe-b) + 32px); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--paper); border-top: 1px solid var(--rule); padding-bottom: var(--safe-b); }
nav.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 720px; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs button { width: 100%; height: 100%; border: 0; border-radius: 0; background: none; color: var(--ink-3); font: 500 13px var(--body); cursor: pointer; border-top: 2px solid transparent; margin-top: -1px; -webkit-tap-highlight-color: transparent; }
nav.tabs button:focus:not(:focus-visible) { outline: none; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--green); }
nav.tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }

h1 { font-family: var(--cond); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 4px 0 12px; letter-spacing: -0.01em; }
h2 { font-family: var(--cond); font-weight: 600; font-size: 18px; line-height: 1.2; margin: 24px 0 8px; } h2:first-child { margin-top: 0; }
h3 { font: 600 15px var(--body); margin: 16px 0 8px; }
p { margin: 0 0 10px; } .muted { color: var(--ink-3); } .small { font-size: 13px; } .lead { color: var(--ink-2); max-width: 60ch; } a { color: var(--green); }

button, .btn { font: 500 14px var(--body); color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 12px; cursor: pointer; }
a.btn { display: inline-block; text-decoration: none; }
button.primary { background: var(--green); border-color: var(--green); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0F1A12; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0F1A12; } }
button.quiet { background: none; border-color: transparent; color: var(--green); padding: 6px 8px; } button.danger { color: var(--flag); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; } button:disabled { opacity: .5; cursor: default; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; } .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
label { display: block; font-size: 13px; color: var(--ink-2); margin: 12px 0 4px; }
input[type=file] { display: block; width: 100%; margin-top: 4px; font: 400 14px var(--body); color: var(--ink); }
input[type=text], input[type=number], input[type=date], input[type=url], select, textarea { width: 100%; font: 400 16px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 10px; }
input[type=number] { -moz-appearance: textfield; } input[type=range] { width: 100%; accent-color: var(--green); }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
.check { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 15px; color: var(--ink); } .check input { width: 18px; height: 18px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; } .seg button { border: 0; border-radius: 0; background: none; padding: 7px 12px; color: var(--ink-2); } .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.list { border-top: 1px solid var(--rule); }
.item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 12px 0; color: inherit; font: inherit; cursor: pointer; }
.item:hover { background: var(--paper-2); } .item .t { font-weight: 500; } .item .s { color: var(--ink-3); font-size: 13px; margin-top: 2px; } .item .n { font-family: var(--cond); font-weight: 600; font-size: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; } th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 500; color: var(--ink-3); font-size: 12px; white-space: normal; line-height: 1.2; } th:first-child, td:first-child { text-align: left; padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
td.num { font-family: var(--cond); font-weight: 600; font-size: 16px; } .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; } tr.flag td { color: var(--flag); }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--rule); vertical-align: middle; }
.tag.green { background: var(--green-soft); color: var(--green); border-color: transparent; } .tag.flag { background: var(--flag-soft); color: var(--flag); border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { font: 600 13px var(--cond); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* gapping ladder */
.ladder { margin: 6px 0 4px; }
.rung { display: grid; grid-template-columns: 44px 1fr 64px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.rung .club { font-family: var(--cond); font-weight: 700; font-size: 18px; } .rung .club small { display: block; font: 400 11px var(--body); color: var(--ink-3); }
.rung .bar { position: relative; height: 28px; background: var(--paper-2); border-radius: 4px; }
.rung .stock { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 4px; }
.rung .pure { position: absolute; top: 0; bottom: 0; background: var(--green); opacity: .35; }
.rung .assumed { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); } .rung .assumed::after { content: ""; position: absolute; left: -3px; top: -4px; width: 8px; height: 4px; background: var(--ink); }
.rung .val { text-align: right; } .rung .val b { font-family: var(--cond); font-weight: 700; font-size: 20px; display: block; line-height: 1; } .rung .val small { color: var(--ink-3); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin: 8px 0 0; } .legend i { display: inline-block; width: 12px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.l-stock { background: var(--green); } .l-pure { background: var(--green); opacity: .35; } .l-ass { background: var(--ink); width: 2px !important; height: 12px !important; }
.l-p { background: var(--green); } .l-r { background: var(--sand-2); } .l-s { background: var(--ink-3); } .l-t { background: var(--flag); }

/* dot strips */
.strip { display: block; width: 100%; height: 30px; }
.strip .axis { stroke: var(--rule); stroke-width: 1; } .strip .tgt { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 2 2; }
.dot-pure { fill: var(--green); } .dot-runner { fill: var(--sand-2); } .dot-short { fill: var(--ink-3); } .dot-top { fill: var(--flag); } .dot-unknown, .dot- { fill: var(--ink-3); }
.block-row { display: grid; grid-template-columns: 58px 1fr 50px; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 10px 0; color: inherit; font: inherit; cursor: pointer; }
.block-row:hover { background: var(--paper-2); } .block-row .c { font-family: var(--cond); font-weight: 700; font-size: 18px; line-height: 1.1; } .block-row .c small { display: block; font: 400 11px var(--body); color: var(--ink-3); }
.block-row .n { font-family: var(--cond); font-weight: 600; font-size: 20px; text-align: right; } .block-row .n small { display: block; font: 400 11px var(--body); color: var(--ink-3); }

/* strike profile bars */
.profile { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--paper-2); } .profile span { display: block; height: 100%; }
.p-pure { background: var(--green); } .p-runner { background: var(--sand-2); } .p-short { background: var(--ink-3); opacity: .55; } .p-top { background: var(--flag); }
.prow { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; padding: 6px 0; } .prow b { font-family: var(--cond); font-size: 17px; } .prow small { text-align: right; color: var(--ink-3); font-size: 12px; }

/* score strip */
/* minmax(0, 1fr), not 1fr: a plain 1fr column won't shrink below its cells' minimum size, so when an
   unfinished round's squares took on the empty-state box's padding the strip ran 415px past a phone's width. */
.scorestrip { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin: 6px 0; }
.sq { aspect-ratio: 1; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 700; font-size: 15px; line-height: 1; border: 0; padding: 0; cursor: pointer; color: var(--ink); background: var(--paper-2); }
.sq small { font: 400 9px var(--body); color: var(--ink-3); margin-top: 2px; } .sq.tiny { font-size: 11px; border-radius: 3px; }
.sq.under { background: var(--green); color: #fff; } .sq.under small { color: rgba(255,255,255,.75); }
.sq.par { background: var(--green-soft); } .sq.b1 { background: var(--sand); } .sq.b2 { background: var(--flag-soft); } .sq.b3 { background: var(--flag); color: #fff; } .sq.b3 small { color: rgba(255,255,255,.75); }
/* Not "empty": that's the empty-state box, whose 22px padding swelled these squares. */
.sq.unscored { background: var(--paper-2); color: var(--ink-3); border: 1px dashed var(--rule); }
.scorestrip.mini { grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 2px; margin: 6px 0 0; } .scorestrip.mini .sq { border-radius: 2px; font-size: 0; min-height: 8px; aspect-ratio: auto; height: 8px; }

/* hole stencils */
.stencils { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 8px 0; }
.tile { background: var(--paper-2); border-radius: 10px; padding: 8px 6px 6px; border: 0; cursor: pointer; text-align: center; color: inherit; font: inherit; }
.tile:hover { outline: 1px solid var(--rule); } .tile svg { width: 100%; height: auto; display: block; }
.tile .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 4px; padding: 0 2px; } .tile .lab b { font-family: var(--cond); font-size: 15px; color: var(--ink); }
.tile.hot .lab b { color: var(--flag); }
.tile.missing { background: none; border: 1.5px dashed var(--flag); } .tile.missing .miss { aspect-ratio: 60 / 100; display: flex; align-items: center; justify-content: center; font: 300 34px var(--body); color: var(--flag); } .tile.missing .lab b, .tile.missing .lab span { color: var(--flag); }
.stencil .rough { fill: none; stroke: var(--rough); stroke-linecap: round; stroke-linejoin: round; } .stencil .fw { fill: none; stroke: var(--fw); stroke-linecap: round; stroke-linejoin: round; }
.stencil .green { fill: var(--green-2); } .stencil .tee { fill: var(--green-2); } .stencil .bunker { fill: var(--sand-2); } .stencil .water { fill: var(--water); }
.stencil .flag { stroke: var(--paper); stroke-width: .8; } .stencil .flagc { fill: var(--flag); }
.stencil .trace { fill: none; stroke: var(--ink); stroke-width: .9; stroke-dasharray: 1.5 1.5; opacity: .8; } .stencil .ball { fill: var(--paper); stroke: var(--ink); stroke-width: .9; }
.stencil .ball.pen { stroke: var(--flag); } .stencil text { font: 700 5px var(--cond); fill: var(--ink); }
.bigmap { max-width: 270px; margin: 0 auto; background: var(--paper-2); border-radius: 12px; padding: 10px; touch-action: manipulation; } .bigmap svg { width: 100%; height: auto; display: block; cursor: crosshair; }
.map-hint { text-align: center; font-size: 12px; color: var(--ink-3); margin: 6px 0 10px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; } .stepper b { font-family: var(--cond); font-size: 20px; min-width: 22px; text-align: center; } .stepper button { padding: 4px 10px; }
.shotlist { font-size: 13px; } .shotlist div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--rule); }

/* bars */
.hbar { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; } .hbar i { display: block; height: 14px; border-radius: 3px; background: var(--green); } .hbar i.flag { background: var(--flag); } .hbar i.sand { background: var(--sand-2); }
.hbar small { text-align: right; color: var(--ink-2); }
.trend { display: flex; align-items: flex-end; gap: 6px; height: 80px; border-bottom: 1px solid var(--rule); padding-bottom: 0; } .trend button { flex: 1; background: var(--green); opacity: .85; border: 0; border-radius: 4px 4px 0 0; padding: 0; min-width: 14px; max-width: 48px; position: relative; }
.trend button span { position: absolute; top: -18px; left: 0; right: 0; font: 600 12px var(--cond); color: var(--ink); text-align: center; }

.empty { border: 1px dashed var(--rule); border-radius: var(--r); padding: 22px 16px; color: var(--ink-2); margin: 10px 0; } .empty p { margin-bottom: 12px; }
.notice { background: var(--paper-2); border-left: 3px solid var(--green); padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0; font-size: 13px; color: var(--ink-2); margin: 0 0 16px; } .notice.warn { border-left-color: var(--flag); }
.back { margin: -4px 0 12px; } .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; } .kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.stat { display: inline-block; margin-right: 22px; margin-bottom: 8px; } .stat b { font-family: var(--cond); font-weight: 700; font-size: 28px; line-height: 1; display: block; } .stat small { color: var(--ink-3); font-size: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 14px); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: var(--r); font-size: 13px; z-index: 9; opacity: 0; transition: opacity .15s; pointer-events: none; } .toast.show { opacity: 1; }
.hole-grid { display: grid; grid-template-columns: 36px 52px 1fr 1fr; gap: 6px 8px; align-items: center; font-size: 14px; } .hole-grid input { padding: 7px 8px; text-align: right; } .hole-grid .h { color: var(--ink-3); font-size: 12px; }
dialog.sheet { border: 0; padding: 0; margin: 0; width: 100%; max-width: 720px; left: 50%; transform: translateX(-50%); top: auto; bottom: 0; max-height: calc(100% - 40px); background: var(--paper); color: var(--ink); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18); }
dialog.sheet::backdrop { background: rgba(10, 20, 12, .45); } dialog.sheet .inner { padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: calc(100vh - 60px); } dialog.sheet h2 { margin-top: 4px; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; background: var(--paper); padding-top: 10px; } .count { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.stencil.art .trace { stroke: #fff; stroke-width: 1.8; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; opacity: .95; }
.stencil.art .ball { fill: #fff; stroke: #1B2A20; stroke-width: 1.4; vector-effect: non-scaling-stroke; } .stencil.art .ball.pen { stroke: var(--flag); stroke-width: 2.2; }
.stencil .calline { fill: none; stroke: var(--flag); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; }
.stencil .calgr { fill: rgba(255,255,255,.12); stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; }
.stencil .cal { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; } .stencil .cal.tee { stroke: #fff; } .stencil .cal.grn { stroke: var(--flag); } .stencil .cal.turn { stroke: #F2C94C; }
[data-cal][aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.lie { font: 500 12px var(--body); padding: 4px 9px; }
.armrow { display: flex; flex-direction: column; gap: 5px; align-items: center; margin: 4px 0 10px; }
.armrow .chips { justify-content: center; }
.quick { margin-top: 8px; } .qrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.qrow .qn { font-family: var(--cond); font-weight: 700; font-size: 17px; min-width: 44px; } .qrow .qn small { display: block; font: 400 10px var(--body); color: var(--ink-3); }
.qrow .chips { flex-wrap: nowrap; overflow-x: auto; }
details.sec > summary { cursor: pointer; }
.shotrow { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 8px 0; font: inherit; color: inherit; cursor: pointer; font-size: 13px; }
.shotrow:hover { background: var(--paper-2); }
.nextlist { margin: 6px 0 0; padding-left: 20px; } .nextlist li { margin: 6px 0; font-size: 14px; }
.basis { font-size: 12px; color: var(--ink-2); background: var(--paper-2); border-radius: var(--r); padding: 7px 10px; margin: 8px 0; } .basis.slim { background: none; padding: 0; color: var(--ink-3); margin: 4px 0 0; }
details.pcard > summary { cursor: pointer; font-size: 14px; } details.pcard > summary b { font-family: var(--cond); font-size: 15px; }
.steps { margin: 6px 0 0; padding-left: 20px; font-size: 14px; } .steps li { margin: 10px 0; }
.sec { display: block; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--rule); clear: both; }
.sec > .spread > h2 { margin-top: 0; }
.filmstrip .frame { position: relative; padding: 0; border: 0; background: none; border-radius: 4px; flex: 0 0 auto; cursor: pointer; }

<body>

<script>
/* ============================================================
   Carry — range and round tracker
   Data: three collections in the artifact db.
     clubs/<code>     one doc per club
     courses/<id>     one doc per course, holes embedded
     sessions/<id>    one doc per session; range blocks and shots,
                      or round hole scores, embedded

   derived at render time, never stored.
   ============================================================ */
'use strict';
/* ---------- state ---------- */
const S = {
  db: null, dbState: 'connecting',            // connecting | ready | none
  clubs: [], courses: [], sessions: [], settings: null, sampleOk: false,
  tab: 'overview', sub: null,                 // sub: {sessionId, blockId, courseId}
};
try { const t = localStorage.getItem('carry.tab'); if (['overview','range','rounds','courses','bag'].includes(t)) S.tab = t; } catch (e) {}

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toFixed(d);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
// A round belongs to his calendar day in Sydney, not UTC's: toISOString() would
// date anything before 10am as yesterday.
const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => localDay(new Date());
const dateLabel = iso => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); };
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const quantile = (a, q) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const pos = (s.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return s[lo] + (s[hi] - s[lo]) * (pos - lo); };

// The page runs sandboxed, where window.confirm is ignored and returns
// false, so destructive actions must ask in-page instead.
function confirmAsk(message, okLabel = 'Delete') {
  return new Promise(resolve => {
    const dlg = document.getElementById('confirmDlg'), yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');
    document.getElementById('confirmMsg').textContent = message; yes.textContent = okLabel;
    const done = v => { yes.onclick = no.onclick = dlg.onclose = null; if (dlg.open) dlg.close(); resolve(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false); dlg.onclose = () => done(false);
    dlg.showModal();
  });
}
let toastT; function toast(msg, ms = 1800) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
function setStatus(txt, err) { const s = $('#status'); s.textContent = txt; s.classList.toggle('err', !!err); }

/* ---------- db ---------- */
async function connect() {
  render();
  const db = await claude.use('db');
  if (!db) { S.dbState = 'none'; setStatus('Storage unavailable in this view', true); render(); return; }
  S.db = db; S.dbState = 'ready'; setStatus('');
  checkForUpdate(); loadMe();
  try { S.assets = await claude.use('assets'); } catch (e) { S.assets = null; }
  // Swing analysis needs a view that can send images to Claude.
  try { const sm = await claude.use('sample'); const lim = sm ? await sm.limits().catch(() => null) : null; S.sampleOk = !!(lim && lim.images); render(); } catch (e) { S.sampleOk = false; }
  const onErr = e => { if (e && (e.code === 'unauthorised' || e.code === 'signed_out')) return askSignIn(e.code); setStatus('Storage error: ' + (e && e.code || 'unknown'), true); };
  db.collection('clubs').onSnapshot(snap => { S.clubs = snap.docs.map(d => d.data()).sort((a, b) => (a.order ?? 99) - (b.order ?? 99)); render(); }, onErr);
  db.collection('courses').onSnapshot(snap => { S.courses = snap.docs.map(d => d.data()).sort((a, b) => a.name.localeCompare(b.name)); render(); }, onErr);
  setTimeout(() => runMigrations(), 400);
  db.collection('settings').onSnapshot(snap => { S.settings = (snap.docs[0] && snap.docs[0].data()) || null; render(); }, onErr);
  db.collection('sessions').onSnapshot(snap => { S.sessions = snap.docs.map(d => d.data()).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0)); render(); }, onErr);

// Sign-in is Cloudflare Access (2.0.0). Two ways to be refused, said once:
// the Access session ran out (Cloudflare redirects instead of answering), or
// the page was opened at an address that doesn't go through Cloudflare (the
// NAS's own http://…:1818), which no longer opens anything. Asked once per
// page load: every poll fails the same way, and Cancel should mean it.
let askingSignIn = false;
function askSignIn(code) {
  if (askingSignIn) return;
  askingSignIn = true;
  const expired = code === 'signed_out';
  setStatus(expired ? 'Signed out' : 'Not signed in', true);
  openSheet(expired
    ? `<h2>Sign in again</h2>
      <p class="small muted">Your sign-in has expired. Nothing unsaved is lost from what's on screen, but changes can't be saved until you sign in again.</p>`
    : `<h2>Open Carry through Cloudflare</h2>
      <p class="small muted">Carry now signs you in with Cloudflare Access, so it only opens at its Cloudflare address (for example https://carry.elevengrant.com). The NAS's own address no longer works, on the LAN too.</p>`,
    async () => { location.reload(); return true; });

}
async function save(col, id, doc) {
  if (!S.db) { toast('Storage unavailable'); return false; }
  try { await S.db.collection(col).doc(id).set(doc); return true; }
  catch (e) { toast('Save failed: ' + (e && e.code || 'unknown')); return false; }
}
async function remove(col, id) {
  if (!S.db) { toast('Storage unavailable'); return false; }
  try { await S.db.collection(col).doc(id).delete(); return true; }
  catch (e) {
    // The server says why when it can (a shared course someone else has played on).
    let why = e && e.code || 'unknown';
    if (e && e.status === 409) { try { why = JSON.parse(e.message).message || why; } catch (x) {} }
    toast('Delete failed: ' + why, 4000); return false;
  }
}
const clubBy = code => S.clubs.find(c => c.code === code);
const activeClubs = () => S.clubs.filter(c => !c.retired);
const session = id => S.sessions.find(s => s.id === id);
const course = id => S.courses.find(c => c.id === id);

/* ---------- which version is running ----------
   The page's own version and commit are stamped into its <meta> tags by the
   server as it serves the page, so a phone running a cached copy reports
   the build it actually has. /api/version says what the server has; if the
   two differ, this device is behind. */
// "__…" means the file wasn't served through the server (opened raw): call it "dev".
const metaOf = n => { const v = (document.querySelector(`meta[name="${n}"]`) || {}).content || ''; return !v || v.startsWith('__') ? 'dev' : v; };
const APP = { version: metaOf('app-version'), commit: metaOf('app-commit') };
$('#sub').textContent = 'v' + APP.version;
// Behind if the version differs, or the same version was rebuilt from a
// different commit (a release that forgot to bump). "dev" builds are never
// compared by commit.
const isStale = info => !!info && (info.version !== APP.version ||
  (info.commit !== 'dev' && APP.commit !== 'dev' && info.commit !== APP.commit));
async function fetchVersion() {
  const r = await fetch('/api/version', AbortSignal.timeout ? { signal: AbortSignal.timeout(10000) } : {});
  if (!r.ok) throw new Error('version ' + r.status);
  return r.json();
}
// On startup, and whenever the app comes back to the foreground (a home-screen
// app can stay open for days), nudge if this device is behind. At most once
// every ten minutes.
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (Date.now() - lastUpdateCheck < 600000) return;
  lastUpdateCheck = Date.now();
  try { const info = await fetchVersion(); if (isStale(info)) toast(`Version ${info.version} is ready. Close and reopen the app to update.`, 8000); }
  catch (e) { /* offline: nothing to compare against */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
// Tapping the title: this build, whether the server has a newer one, and the history.
async function openVersion() {
  openSheet(`<h2>Carry ${esc(APP.version)}</h2><p class="small muted">Build ${esc(APP.commit)}</p>
    <p id="verStatus" class="small">Checking the server…</p><ol class="vlist" id="verList"></ol>`);
  let info = null;
  try { info = await fetchVersion(); } catch (e) {}
  const status = $('#verStatus', sheetInner), list = $('#verList', sheetInner); if (!status) return;
  if (!info) { status.textContent = "Couldn't reach the server, so I can't check for a newer version."; return; }
  lastUpdateCheck = Date.now();

    ? `<b>The server has ${esc(info.version)} (build ${esc(info.commit)}), but this device is still running ${esc(APP.version)}.</b> Close the app fully and reopen it to update.`

/* ---------- analytics ---------- */
// Full-swing shots for one club across every range session.

// are always replaced (never mutated) when data arrives.
let memo = { key: [], map: new Map() };

let mapEpoch = 0;
function mapArrived() { mapEpoch++; render(); }
function memoised(name, arg, fn) {

}
// A session's full-swing shots for one club, each tagged with where it came from.
function sessionFullShots(s, code) {

}
// The shots a session's own page classifies against: the club's counted

const shotsWithSession = (code, s) => countsForNumbers(s) ? fullShots(code) : fullShots(code).concat(sessionFullShots(s, code));

/* ---------- which range shots count, and how much ----------
   A range session counts towards club numbers unless he's left it out, it's
   outside the date window, or its ball type doesn't match the ball filter.
   Within that, recent shots count more (unless he picks "every shot the

const BALLS = [['all', 'All balls'], ['range', 'Range balls'], ['better', 'Premium & own']];

const weighting = () => settings().weighting === 'equal' ? 'equal' : 'recent';

function ballOk(s) {

const countsForNumbers = s => s.type === 'range' && !s.excluded && withinWindow(s.date) && ballOk(s);
// Age in whole local days: every shot from the same day weighs exactly the

const daysAgo = d => Math.max(0, Math.round((new Date(today() + 'T00:00:00') - new Date(d + 'T00:00:00')) / 864e5));

// [value, weight] pairs. With equal weights this is exactly the ordinary median.

// Strike profile, relative to the club's own data.

function classify(shots) {

  const ref = quantile(live.map(s => s.carry), 0.9);

}

/* ---------- routing ---------- */
function go(tab, sub = null) {

}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
function parseGo(str) {
  const i = str.indexOf(':'); if (i < 0) return [str, null];

  if (rest.includes('=')) { const sub = {}; rest.split(',').forEach(p => { const [k, v] = p.split('='); sub[k] = v; }); return [tab, sub]; }
  const j = rest.indexOf(':'); return [tab, { [rest.slice(0, j)]: rest.slice(j + 1) }];
}
function render() {
  if (window.HoleMap) HoleMap.onLoad = mapArrived;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));

  // Every save redraws the view; panels he opened stay open (matched by id).

}

});
const back = (tab, sub, label) => `<div class="back"><button class="quiet" data-go="${tab}${sub ? ':' + sub : ''}">‹ ${esc(label)}</button></div>`;

/* ---------- shared visuals ---------- */

function dotStrip(shots, profs, target, maxX) {

  const x = v => (pad + (W - 2 * pad) * v / mx).toFixed(1);

    <line class="axis" x1="${pad}" y1="${H - 8}" x2="${W - pad}" y2="${H - 8}"/>

/* ---------- penalty report ----------
   Which shots cost penalty strokes, and where. Only traced holes count
   (a scorecard-only round doesn't say whether it had penalties). A penalty

  const traced = S.sessions.filter(s => s.type === 'round').flatMap(r => holesOf(r).filter(h => (h.shots || []).length).map(h => ({ r, h })));
  const recs = shotRecords();
  const attached = traced.flatMap(({ r, h }) => (h.shots || []).map((s, i) => ({ r, h, s, i })).filter(x => x.s.penalty))

  const used = traced.flatMap(({ h }) => (h.shots || []).map(s => s.club || '?')).reduce((a, c) => (a[c] = (a[c] || 0) + 1, a), {});

  for (const { r, h } of traced) {
    const n = (h.penalties || 0) + (h.shots || []).filter(s => s.penalty).length; if (!n) continue;
    const k = r.courseId + '|' + h.n, e = holes[k] = holes[k] || { course: r.courseName, n: h.n, strokes: 0, rounds: [], latest: null };
    e.strokes += n; e.rounds.push(r.id);
    if (!e.latest || r.date > e.latest.date) e.latest = r;
  }
  const scorecardOnly = S.sessions.filter(s => s.type === 'round' && !(s.holes || []).some(h => (h.shots || []).length)).length;
  return { total: attached.length + loose, attached, loose, traced: traced.length, holesWith: Object.keys(holes).length, scorecardOnly,
    byClub: group(attached, x => x.club).map(([club, n]) => ({ club, n, of: used[club] || 0 })),
    byKind: group(attached, x => x.kind), byLie: group(attached, x => x.lie),
    holes: Object.values(holes).sort((a, b) => b.strokes - a.strokes || b.rounds.length - a.rounds.length) };
}

  const p = penaltyReport();
  let h = back('rounds', null, 'Rounds') + `<h1>Penalty report</h1>`;
  if (!p.traced) return h + `<div class="empty"><p>Penalties are only known on holes you traced shot by shot. Trace a round and this fills in.</p></div>`;
  if (!p.total) return h + `<p class="muted">No penalty strokes in ${plural(p.traced, 'traced hole')}.</p>`;
  h += tileGrid('penTiles', [tile(p.total, 'penalty strokes'), tile(`${p.holesWith}`, 'holes with one', `of ${p.traced} traced`), tile(p.attached.length, 'tied to a shot'), tile(p.loose, 'not tied to a shot')]);
  if (p.loose) h += `<p class="small muted" id="penLoose">${plural(p.loose, 'penalty', 'penalties')} ${p.loose === 1 ? 'was' : 'were'} added with a hole's penalty counter, so what caused ${p.loose === 1 ? 'it' : 'them'} isn't known. Next time, open the shot and tick "This shot cost a penalty".</p>`;
  if (p.attached.length) {

  h += `<h2>Holes</h2><div class="list" id="penHoles">` + p.holes.map(x => `<button class="item" data-go="rounds:sessionId=${x.latest.id},hole=${x.n}"><div class="spread"><div><div class="t">${esc(x.course)} · hole ${x.n}</div><div class="s">${plural(x.strokes, 'penalty stroke')} in ${plural(new Set(x.rounds).size, 'round')}${new Set(x.rounds).size > 1 ? ' — a repeat' : ''}</div></div><span class="muted small">latest ›</span></div></button>`).join('') + `</div>`;

/* ---------- estimated handicap ----------
   The World Handicap System, as Golf Australia runs it, applied to his own
   rounds. An estimate, not an official GA handicap: no playing conditions
   calculation (PCC is taken as 0), and it only knows the rounds logged here.
   Nothing is stored; the whole history is replayed on every draw, because
   each round's hole caps depend on the index he had before it.

   Score differential = 113 / Slope × (adjusted gross score − Course Rating),
   to one decimal. Adjusted gross caps each hole at net double bogey (par + 2
   + strokes received), or at par + 5 until there is an index. Index = mean
   of the lowest differentials among the latest 20 (HCP_TABLE), capped at
   54.0, with the exceptional-score reduction and the soft and hard caps.
   9-hole scores are paired in date order into one 18-hole score. */
const HCP_MAX = 54;

const HCP_TABLE = { 3: [1, -2], 4: [1, -1], 5: [1, 0], 6: [2, -1], 7: [2, 0], 8: [2, 0], 9: [3, 0], 10: [3, 0], 11: [3, 0], 12: [4, 0], 13: [4, 0], 14: [4, 0], 15: [5, 0], 16: [5, 0], 17: [6, 0], 18: [6, 0], 19: [7, 0], 20: [8, 0] };

    if (score != null && hi == null) { ags += Math.min(score, h.par + 5); continue; }
    if (score != null && score <= h.par + 2 + least) { ags += score; continue; }   // under any cap: no stroke index needed

const handicap = () => memoised('handicap', '', handicapUncached);
function handicapUncached() {
  const rounds = S.sessions.filter(s => s.type === 'round' && s.date && (s.holes || []).some(h => h.strokes != null))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
  let hi = null, waiting = null;
  const scores = [], left = [], history = [];
  for (const r of rounds) {

    let s = sc;
    if (sc.n === 9) {

    if (drop) { s.exceptional = drop; for (const x of scores.slice(-20)) x.adj -= drop; }

    let next = tenth(mean(last.map(x => x.diff + x.adj).sort((a, b) => a - b).slice(0, k)) + adjust);

/* ---------- overview ---------- */
// The home screen: how he's playing, what to work on, then the picture

function vOverview() {
  const stats = activeClubs().map(c => ({ c, s: clubStats(c.code) })).filter(x => x.s && x.s.stockCarry);
  const rounds = S.sessions.filter(s => s.type === 'round' && (s.holes || []).some(h => h.strokes != null));   // newest first
  let h = `<h1>Overview</h1>`;

  // 2.5.0: the answer first (how he's playing, the one next practice), the

const signed = (v, d = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);

const RECENT_ROUNDS = 5;
const tileGrid = (id, ts) => `<div class="tiles${ts.length === 4 || ts.length === 2 ? ' c2' : ''}" id="${id}">${ts.join('')}</div>`;

/* ---------- current form ---------- */
// The last round, and the last few rounds together. Each tile appears only
// when the rounds actually carry that information.
function overviewForm(rounds) {
  if (!rounds.length) return '';
  const last = rounds[0], ls = roundStats(last), recent = rounds.slice(0, RECENT_ROUNDS).map(r => ({ r, st: roundStats(r) }));
  // Penalties are only known on rounds where shots or penalties were logged.
  const lastTraced = holesOf(last).filter(hh => (hh.shots || []).length || hh.penalties != null);
  const pens = lastTraced.length ? sum(lastTraced.map(hh => (hh.penalties || 0) + (hh.shots || []).filter(x => x.penalty).length)) : null;
  const tiles = [tile(`${ls.gross}<span class="tp">${signed(ls.toPar)}</span>`, 'last score', `${esc(last.courseName)}, ${dateLabel(last.date)}${ls.holes !== 18 ? ` · ${ls.holes} holes` : ''}${pens != null ? ` · ${plural(pens, 'penalty', 'penalties')}` : ''}`)];
  if (recent.length >= 2) {
    const holes = sum(recent.map(x => x.st.holes)), over = sum(recent.map(x => x.st.toPar));

  if (fir.of >= 5) more.push(tile(`${pct(fir.hit, fir.of)}%`, 'fairways', `${fir.hit} of ${fir.of}`));

}

/* ---------- what to work on ---------- */

/* ---------- gapping ---------- */
// Adjacent clubs in bag order. Flags are relative to his own gaps: a club
// that carries no further than the next one down, or a gap under a third /
// over twice his median gap. Descriptive — worth a look, not a verdict.
function gapHealth(stats) {
  const byBag = stats.slice().sort((a, b) => (a.c.order ?? 99) - (b.c.order ?? 99) || (a.c.loft || 0) - (b.c.loft || 0));
  const pairs = byBag.slice(1).map((b, k) => { const a = byBag[k]; return { a, b, gap: a.s.stockCarry - b.s.stockCarry }; });
  const med = median(pairs.map(p => p.gap).filter(g => g > 0));
  for (const p of pairs) {
    const early = p.a.s.n < 5 || p.b.s.n < 5;
    if (p.gap <= 0) p.flag = `${p.a.c.code} carries no further than ${p.b.c.code}`;
    else if (pairs.length >= 3 && med && p.gap < med / 3) p.flag = 'much closer than your other gaps';
    else if (pairs.length >= 3 && med && p.gap > med * 2) p.flag = 'much wider than your other gaps';
    p.early = early;
  }
  return { pairs, median: med };
}
function overviewGapping(stats) {

  const ladder = stats.slice().sort((a, b) => b.s.stockCarry - a.s.stockCarry);
  const maxM = Math.max(200, ...ladder.map(x => Math.max(x.s.pureCarry || 0, x.s.stockCarry, x.c.nominalCarry || 0)));
  const w = m => (100 * m / maxM).toFixed(1) + '%';

      <div class="club">${esc(c.code)}</div>
      <div class="bar">${s.pureCarry ? `<div class="pure" style="left:${w(s.stockCarry)};width:${w(Math.max(0, s.pureCarry - s.stockCarry))}"></div>` : ''}<div class="stock" style="width:${w(s.stockCarry)}"></div>${c.nominalCarry ? `<div class="assumed" style="left:${w(c.nominalCarry)}" title="assumed carry ${c.nominalCarry}m"></div>` : ''}${sp ? `<div class="spread" style="left:${w(sp.p10)};width:${w(sp.p90 - sp.p10)}" title="${esc(c.code)}: middle half ${fmt(sp.p25)}–${fmt(sp.p75)}m, most ${fmt(sp.p10)}–${fmt(sp.p90)}m (${sp.n} shots)"><i style="left:${(100 * (sp.p25 - sp.p10) / ((sp.p90 - sp.p10) || 1)).toFixed(1)}%;width:${(100 * (sp.p75 - sp.p25) / ((sp.p90 - sp.p10) || 1)).toFixed(1)}%"></i></div>` : ''}</div>
      <div class="val"><b>${fmt(s.stockCarry)}</b><small>${s.pureCarry ? 'pure ' + fmt(s.pureCarry) : 'carry'}</small></div>
      <div class="conf small ${(s.weighted ? s.nEff : s.n) < 5 ? 'early' : ''}">${s.n} shots${s.weighted ? ` · counts like ${s.nEff} recent` : ''} · ${confidence(s.weighted ? s.nEff : s.n)}${sp ? ` · <span class="mid">${fmt(sp.p25) === fmt(sp.p75) ? `middle half at ${fmt(sp.p25)}m` : `middle half ${fmt(sp.p25)}–${fmt(sp.p75)}m`}</span>` : ''}</div></div>`; }).join('') + `</div>
    <div class="legend"><span><i class="l-stock"></i>stock carry (median)</span><span><i class="l-pure"></i>to pure</span><span><i class="l-ass"></i>assumed</span>${ladder.some(x => carrySpread(x.c.code)) ? '<span><i class="l-spread"></i>where they land: middle half, and 8 in 10</span>' : ''}</div>`;

  const flagged = g.pairs.filter(p => p.flag).length;
  if (g.pairs.length) h += fold('gapPanel', 'Distance gaps', flagged ? `<span class="warn">⚠ ${plural(flagged, 'gap')} worth a look</span>` : g.median ? `typical gap ${fmt(g.median)}m` : '',
    `<div class="gaps" id="gapList">` + g.pairs.map(p => `<div class="gap ${p.flag ? 'flag' : ''}"><span>${esc(p.a.c.code)} → ${esc(p.b.c.code)}</span><b>${fmt(p.gap)}m</b><small>${p.flag ? '⚠ ' + esc(p.flag) : ''}${p.early ? `${p.flag ? ' · ' : ''}early signal` : ''}</small></div>`).join('') + `</div>
    <p class="small muted">Stock carry between clubs next to each other in the bag${g.median ? `; your typical gap is ${fmt(g.median)}m` : ''}. Flags compare with your own gaps — worth a look, not a verdict.</p>`);

    ladder.map(({ c, s }) => `<div class="prow"><b>${esc(c.code)}</b>${profileBar(s)}<small>${pct(s.pure, s.n)}% pure</small></div>`).join('') +
    `<div class="legend"><span><i class="l-p"></i>pure</span><span><i class="l-r"></i>low runner</span><span><i class="l-s"></i>short</span><span><i class="l-t"></i>topped</span></div></details>`;

}

// Where a club's full swings actually land (tops left out, as for stock carry):
// the middle half (25th–75th percentile) and 8 in 10 (10th–90th). A plain count

function carrySpread(code) {
  const shots = fullShots(code); if (!shots.length) return null;
  const prof = classify(shots), xs = shots.filter((_, i) => prof[i] !== 'top').map(x => x.carry).sort((a, b) => a - b);
  if (xs.length < 5) return null;
  const q = p => { const k = (xs.length - 1) * p, lo = Math.floor(k), hi = Math.ceil(k); return xs[lo] + (xs[hi] - xs[lo]) * (k - lo); };
  return { n: xs.length, p10: q(0.1), p25: q(0.25), p75: q(0.75), p90: q(0.9) };
}

/* ---------- scoring trend ---------- */
// Per hole, because a 9-hole +12 and an 18-hole +40 can't be averaged as rounds.
function overviewScoring(rounds) {
  if (!rounds.length) return '';
  const rs = rounds.slice(0, 10).reverse(), st = rs.map(r => roundStats(r));
  const tp = st.map(x => x.toPar), tmx = Math.max(...tp), tmn = Math.min(...tp);
  let h = `<h2>Scoring trend</h2><div class="trend">` + rs.map((r, i) => { const x = st[i]; const hgt = 30 + 50 * (tmx === tmn ? 0.5 : (tp[i] - tmn) / (tmx - tmn));
    return `<button style="height:${hgt}%" data-go="rounds:sessionId:${r.id}" title="${esc(r.courseName)}, ${dateLabel(r.date)} — ${x.gross} off par ${x.par}${x.holes !== 18 ? `, ${x.holes} holes` : ''}"><span>${signed(x.toPar)}${x.holes !== 18 ? `<sup>${x.holes}h</sup>` : ''}</span></button>`; }).join('') + `</div>
    <p class="small muted" style="margin-top:6px">Over par, oldest to newest${st.some(x => x.holes !== 18) ? '; a small number is a short round' : ''}. Tap a bar.</p>`;
  const holes = sum(st.map(x => x.holes)), over = sum(st.map(x => x.toPar)), blow = sum(st.map(x => x.blowups.length));
  const best = n => { const xs = st.filter(x => x.holes === n); return xs.length ? Math.min(...xs.map(x => x.toPar)) : null; };
  const tiles = [tile(signed(over / holes, 1), 'over par a hole', `≈ ${signed(over / holes * 18)} per 18 · ${plural(rs.length, 'round')}`)];
  if (best(18) != null) tiles.push(tile(signed(best(18)), 'best 18'));
  if (best(9) != null) tiles.push(tile(signed(best(9)), 'best 9'));
  tiles.push(tile(blow, 'blow-ups', `triple bogey or worse · ${blow} of ${holes} holes`));
  return h + fold('scoreMore', 'Best rounds and blow-ups', `${plural(blow, 'blow-up')} in ${plural(rs.length, 'round')}`, tileGrid('scoreTiles', tiles));
}

/* ---------- where the game is being tested ---------- */
// How often each part of the game missed its target, from shot-level holes.
// Counts, not a model: not strokes gained.
function gameBreakdown() {
  // A shot whose lie was never recorded is left out: not a hit, not a miss.
  const R = shotRecords().filter(x => x.lie !== 'unknown'), rows = [];
  const add = (key, label, xs, missed, what) => { if (xs.length) rows.push({ key, label, of: xs.length, missed: xs.filter(missed).length, what }); };
  add('tee', 'Tee', R.filter(x => x.kind === 'tee'), x => x.lie !== 'fairway', 'missed the fairway');
  add('approach', 'Approach', R.filter(x => x.kind === 'approach'), x => x.lie !== 'green', 'missed the green');
  add('short', 'Short game', R.filter(x => x.kind === 'short'), x => x.lie !== 'green', 'missed the green');
  const rounds = S.sessions.filter(s => s.type === 'round');
  add('putting', 'Putting', rounds.flatMap(r => (r.holes || []).filter(h => h.putts != null)), h => h.putts >= 3, 'took 3+ putts');
  const traced = rounds.flatMap(r => (r.holes || []).filter(h => (h.shots || []).length));
  add('penalty', 'Penalties', traced, h => (h.penalties || 0) + (h.shots || []).filter(x => x.penalty).length > 0, 'had a penalty');
  return { rows, recoveries: R.filter(x => x.kind === 'recovery').length };
}
function overviewBreakdown() {
  const { rows, recoveries } = gameBreakdown();
  if (!rows.some(r => r.key !== 'putting')) return '';
  return `<h2>Where your game is being tested</h2><div id="breakdown">` + rows.map(r => `<div class="hbar brk"><span>${r.label}</span><i class="${r.missed / r.of >= 0.5 ? 'flag' : r.missed / r.of >= 0.25 ? 'sand' : ''}" style="width:${pct(r.missed, r.of)}%"></i><small>${pct(r.missed, r.of)}%</small><em class="small muted">${r.missed} of ${r.of} ${r.what}${r.of < 5 ? ' · early signal' : ''}</em></div>`).join('') +
    `</div><p class="small muted">How often each part of the game missed its target, from the holes you traced${recoveries ? `, plus ${plural(recoveries, 'recovery shot')} from trees, bunkers or water` : ''}. Counts, not strokes gained.</p>` +
    (rows.some(r => r.key === 'penalty' && r.missed) ? `<div class="row-actions" style="margin-top:0"><button class="quiet" data-go="rounds:view=penalties">Penalty report →</button></div>` : '');
}

/* ---------- approach distances ---------- */
function overviewApproaches() {
  const d = courseDemand(); if (!d.bands.length) return '';
  const total = sum(d.bands.map(b => b.n)), top = d.bands.slice().sort((a, b) => b.n - a.n || a.from - b.from).slice(0, 4), shown = top.slice().sort((a, b) => a.from - b.from);
  const most = top[0], mxn = most.n, rest = d.bands.length - top.length;
  const fit = b => { const f = clubFit(b.from + 10); return f.best ? ` <span class="muted">${esc(f.best.c.code)} ${fmt(f.best.ref.v)}m</span>` : ''; };
  return `<h2>Approach distances</h2><div id="approachBands">` + shown.map(b => `<div class="hbar"><span>${b.from}–${b.from + 19}m</span><i style="width:${pct(b.n, mxn)}%"></i><small>${b.n}</small><em class="small">${b.from + 10 >= 60 ? fit(b) : ''}</em></div>`).join('') + `</div>
    <p class="small">Most often ${most.from}–${most.from + 19}m: ${most.n} of ${total} approach shots${rest > 0 ? `; ${plural(rest, 'other band')} not shown` : ''}.</p>
    <p class="small muted">These are the distances your rounds actually ask you to play, with your nearest measured club beside each.</p>`;
}

/* ---------- putting ---------- */

    if (n < 1 || n > 18) { errors.push(`hole ${n} isn't 1–18`); continue; }
    if (holes.has(n)) { errors.push(`hole ${n} is there twice`); continue; }
    if (h.par < 3 || h.par > 6) errors.push(`hole ${n}: par ${h.par}?`);

const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;

// Every shot logged on course, with what it was trying to do.
//   tee       first shot on a par 4 or 5
//   recovery  played from trees, bunker or water
//   short     inside 60m (pitches, chips)
//   approach  everything else, including par-3 tee shots
const shotRecords = () => memoised('shotRecords', '', shotRecordsUncached);
function shotRecordsUncached() {
  const out = [];
  for (const r of S.sessions) if (r.type === 'round') for (const h of holesOf(r)) {
    const shots = h.shots || [];
    shots.forEach((s, i) => {
      const from = i ? toGreen(h, shots[i - 1]) : (h.metres || 0);
      const len = shotLen(h, i), lie = lieOf(h, s);
      if (from == null || len == null) return;            // unplaceable shot: leave it out of the loop
      const fromLie = i ? lieOf(h, shots[i - 1]) : 'tee';
      const recovery = ['trees', 'bunker', 'water'].includes(fromLie);
      const kind = i === 0 && h.par >= 4 ? 'tee' : recovery ? 'recovery' : from < 60 ? 'short' : 'approach';
      out.push({ r, h, i, s, club: s.club, from, fromLie, lie, len, kind, full: !recovery && len >= 30 && from >= 40 });
    });
  }
  return out;
}
const shotHoleCount = () => S.sessions.filter(r => r.type === 'round').reduce((n, r) => n + (r.holes || []).filter(h => (h.shots || []).length).length, 0);

/* ---------- reference distances, with where they came from ---------- */
const rangeBlocksFor = (code, counted = false) => S.sessions.filter(s => s.type === 'range' && (!counted || countsForNumbers(s))).flatMap(s => (s.blocks || []).map(b => ({ ...b, date: s.date }))).filter(b => b.club === code);
function weighted(blocks, key) { const bs = blocks.filter(b => b.summary && b.summary[key] != null && (b.swing || 'full') === 'full'); if (!bs.length) return null; const wt = b => (b.summary.n || 1) * shotWeight(b.date); const w = sum(bs.map(wt)); return sum(bs.map(b => b.summary[key] * wt(b))) / w; }
function carryRef(code) {
  const s = clubStats(code); if (s && s.stockCarry) return { v: s.stockCarry, measured: true, src: 'range', pure: pct(s.pure, s.n) };
  const w = weighted(rangeBlocksFor(code, true), 'avgCarry'); if (w) return { v: w, measured: true, src: 'range summary' };
  const c = clubBy(code); if (!c) return null;
  if (c.nominalCarry) return { v: c.nominalCarry, measured: false, src: 'your estimate' };
  if (c.nominalTotal) return { v: c.nominalTotal * 0.9, measured: false, src: 'estimated from your total' };
  return null;
}
function totalRef(code) {
  const s = clubStats(code); if (s && s.stockTotal) return { v: s.stockTotal, measured: true, src: 'range', max: Math.max(...fullShots(code).map(x => x.total)) };
  const w = weighted(rangeBlocksFor(code, true), 'avgTotal'); if (w) return { v: w, measured: true, src: 'range summary' };
  const c = clubBy(code); if (c && c.nominalTotal) return { v: c.nominalTotal, measured: false, src: 'your estimate' };
  return null;
}

/* ---------- 2. range → course: which club fits ---------- */
function clubFit(dist) {
  const clubs = activeClubs().filter(c => c.category !== 'putter').map(c => ({ c, ref: carryRef(c.code) })).filter(x => x.ref);
  const measured = clubs.filter(x => x.ref.measured).sort((a, b) => Math.abs(a.ref.v - dist) - Math.abs(b.ref.v - dist));
  const unmeasured = clubs.filter(x => !x.ref.measured && Math.abs(x.ref.v - dist) <= 15).sort((a, b) => Math.abs(a.ref.v - dist) - Math.abs(b.ref.v - dist));
  const longest = clubs.filter(x => x.ref.measured).sort((a, b) => b.ref.v - a.ref.v)[0];
  return { best: measured[0], unmeasured: unmeasured[0], longest };
}
function adviceFor(dist) {
  if (!dist || dist < 60) return '';
  const f = clubFit(dist); if (!f.best) return '';
  const tag = x => `<b>${esc(x.c.code)}</b>`;
  if (f.longest && dist > f.longest.ref.v + 20) {
    const tot = totalRef(f.longest.c.code);
    if (tot && tot.measured && dist <= tot.v + 10) return `For ${fmt(dist)}m: ${tag(f.longest)} carries ${fmt(f.longest.ref.v)}m and runs out to about ${fmt(tot.v)}m, so it gets there if it lands short and rolls. Anything in front of the green is in play.`;
    return `Longer than any measured club. ${tag(f.longest)} carries ${fmt(f.longest.ref.v)}m${tot && tot.measured ? `, about ${fmt(tot.v)}m with roll, leaving ~${fmt(dist - tot.v)}m` : ''}.${activeClubs().some(c => c.code === 'D') && !carryRef('D') ? ' Driver has no range data yet.' : ''}`;
  }
  const b = f.best;
  return `For ${fmt(dist)}m: ${tag(b)}, stock carry ${fmt(b.ref.v)}m${b.ref.pure != null ? `, pure ${b.ref.pure}% of the time` : ''}.${f.unmeasured && f.unmeasured.c.code !== b.c.code ? ` ${tag(f.unmeasured)} should fit too but isn't measured yet.` : ''}`;
}

/* ---------- 1. course → range: what to practise ---------- */
// Each item says what it is (key), what it would cost (score, undecayed),
// the dated evidence behind it (ev: {date, cost}), and — where it can be
// counted — every chance it had to happen (chances: {date, hit}). Ranking
// and freshness are worked out from those in assessPractice().
function practiceItems() {
  const R = shotRecords(), items = [], at = x => x.r.date;
  // Tee accuracy, by club
  const tee = {};
  for (const x of R.filter(x => x.kind === 'tee' && x.club && x.lie !== 'unknown')) { const t = tee[x.club] = tee[x.club] || { n: 0, fw: 0, lies: {}, recs: [] }; t.n++; if (x.lie === 'fairway') t.fw++; else t.lies[x.lie] = (t.lies[x.lie] || 0) + 1; t.recs.push(x); }
  const W = { trees: .8, water: 1, bunker: .5, rough: .3 };
  for (const [club, t] of Object.entries(tee)) {
    if (t.fw === t.n) continue; const cs = clubStats(club), ref = carryRef(club);
    items.push({ key: 'tee:' + club, kind: 'tee', n: t.n, score: Object.entries(t.lies).reduce((a, [l, c]) => a + (W[l] ?? .3) * c, 0),
      ev: t.recs.filter(x => x.lie !== 'fairway').map(x => ({ date: at(x), cost: W[x.lie] ?? .3 })), chances: t.recs.map(x => ({ date: at(x), hit: x.lie !== 'fairway' })),
      title: `${club} off the tee: ${t.fw} of ${t.n} fairways`, detail: `Misses: ${Object.entries(t.lies).map(([l, c]) => `${c} ${l}`).join(', ')}. Distance isn't the issue${ref && ref.measured ? ` (stock carry ${fmt(ref.v)}m)` : ''}; direction is.`,
      range: cs ? `On the range: ${pct(cs.pure, cs.n)}% pure, ${pct(cs.top, cs.n)}% topped` : null,
      block: { club, swing: 'full', target: ref ? round5(ref.v) : null, intent: 'Accuracy: pick two markers about 30m apart and count how many finish between them' }, recs: t.recs });
  }
  // Approaches: clubbed short, and clubs that should be covering these distances but aren't measured
  const appr = R.filter(x => (x.kind === 'approach' || (x.i === 0 && x.h.par === 3)) && x.from >= 60 && x.club);
  const measuredAppr = appr.filter(x => { const c = carryRef(x.club); return c && c.measured; });
  const isShort = x => x.from - carryRef(x.club).v > 15;
  const short = measuredAppr.filter(isShort);
  if (short.length) {
    const med = median(short.map(x => x.from)), f = clubFit(med);
    items.push({ key: 'approach', kind: 'approach', n: appr.length, score: .5 * short.length,
      ev: short.map(x => ({ date: at(x), cost: .5 })), chances: measuredAppr.map(x => ({ date: at(x), hit: isShort(x) })),
      title: `Approaches clubbed short: ${short.length} of ${appr.length}`,
      detail: Object.entries(short.reduce((a, x) => ((a[x.club] = a[x.club] || []).push(x.from), a), {})).sort((a, b) => b[1].length - a[1].length)
        .map(([club, ds]) => `${club} ×${ds.length} from ${ds.length > 1 ? `${fmt(Math.min(...ds))}–${fmt(Math.max(...ds))}` : fmt(ds[0])}m (stock ${fmt(carryRef(club).v)}m)`).join('; ') + '.',
      advice: f.best ? `Most of these were from about ${fmt(med)}m, where your measured club is ${f.best.c.code} (${fmt(f.best.ref.v)}m).` : null,
      block: f.best ? { club: f.best.c.code, swing: 'full', target: round5(med), intent: `Commit to the ${f.best.c.code} at the distance your approaches came up short from` } : null, recs: short });
  }
  const bestUnmeasured = {};
  for (const x of appr) { const u = clubFit(x.from).unmeasured; if (u) (bestUnmeasured[u.c.code] = bestUnmeasured[u.c.code] || { ref: u.ref, xs: [] }).xs.push(x); }
  for (const [code, u] of Object.entries(bestUnmeasured)) {
    const ds = u.xs.map(x => x.from);
    items.push({ key: 'measure:' + code, kind: 'measure', n: u.xs.length, score: .4 * u.xs.length, ev: u.xs.map(x => ({ date: at(x), cost: .4 })),
      title: `Measure your ${code}`,
      detail: `${plural(u.xs.length, 'approach', 'approaches')} of ${fmt(Math.min(...ds))}${ds.length > 1 ? '–' + fmt(Math.max(...ds)) : ''}m, where it should sit (about ${fmt(u.ref.v)}m, ${u.ref.src}). It has no range data, so the app can't recommend it.`,
      block: { club: code, swing: 'full', target: round5(median(ds)), intent: 'Establish a stock carry: 20 balls, then add the screenshots' }, recs: u.xs });
  }
  // Clubs in the bag with no range data at all, whether or not a course has asked for them yet
  for (const c of activeClubs().filter(c => c.category !== 'putter')) {
    const ref = carryRef(c.code);
    if ((ref && ref.measured) || items.some(x => x.key === 'measure:' + c.code)) continue;
    items.push({ key: 'measure:' + c.code, kind: 'measure', n: 0, score: .3, fixedWeight: .3, ev: [], note: 'No range data yet.',
      title: `Measure your ${c.code}`, detail: `No range data for the ${c.code} yet, so it can't be planned with or recommended${ref ? ` (you've assumed about ${fmt(ref.v)}m)` : ''}.`,
      block: { club: c.code, swing: 'full', target: ref ? round5(ref.v) : null, intent: 'Establish a stock carry: 20 balls, then add the screenshots' } });
  }
  // Strike, from the range: a club that too often comes off as a low runner or a top
  for (const c of activeClubs().filter(c => c.category !== 'putter')) { const it = strikeItem(c.code); if (it) items.push(it); }
  // Short game
  const sg = R.filter(x => x.kind === 'short' && x.club && x.lie !== 'unknown'), sgMiss = sg.filter(x => x.lie !== 'green');
  if (sgMiss.length) {
    const main = Object.entries(sg.reduce((a, x) => (a[x.club] = (a[x.club] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0][0];
    const chip = rangeBlocksFor(main).filter(b => b.swing === 'chip').sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    const cs = chip && blockSummary(chip);
    items.push({ key: 'short', kind: 'short', n: sg.length, score: .5 * sgMiss.length,
      ev: sgMiss.map(x => ({ date: at(x), cost: .5 })), chances: sg.map(x => ({ date: at(x), hit: x.lie !== 'green' })),
      title: `Short game: ${sgMiss.length} of ${sg.length} missed the green`,
      detail: sgMiss.map(x => `${x.club} from ${fmt(x.from)}m, finished in the ${x.lie}`).join('; ') + '.',
      range: cs && cs.fromPinTotal != null ? `On the range: your ${chip.target}m chip block finished ${fmt(cs.fromPinTotal, 1)}m from the pin on average` : null,
      block: { club: main, swing: 'chip', target: round5(median(sg.map(x => x.from))) || 20, intent: 'Land it on the green: count how many finish inside 3m' }, recs: sgMiss });
  }
  // Putting and penalties, from holes where they were logged
  const ph = S.sessions.filter(r => r.type === 'round').flatMap(r => holesOf(r).filter(h => h.putts != null).map(h => ({ r, h })));
  const threes = ph.filter(p => p.h.putts >= 3);
  if (threes.length) items.push({ key: 'putting', kind: 'putting', n: ph.length, score: threes.length,
    ev: threes.map(p => ({ date: p.r.date, cost: 1 })), chances: ph.map(p => ({ date: p.r.date, hit: p.h.putts >= 3 })),
    title: `Three-putts: ${threes.length} in ${plural(ph.length, 'hole')}`,
    detail: `${sum(ph.map(p => p.h.putts))} putts over ${plural(ph.length, 'hole')}, ${(sum(ph.map(p => p.h.putts)) / ph.length).toFixed(1)} a hole.`, practice: 'Putting green: 20 lag putts from 8–12m, trying to finish inside a metre.', recs: threes.map(p => ({ r: p.r, h: p.h })) });
  const traced = S.sessions.filter(r => r.type === 'round').flatMap(r => holesOf(r).filter(h => (h.shots || []).length).map(h => ({ r, h })));
  // Both kinds: added with the hole's counter, or ticked on the shot that cost it.
  const holePens = h => (h.penalties || 0) + (h.shots || []).filter(s => s.penalty).length;
  const pens = traced.filter(p => holePens(p.h));
  if (pens.length) items.push({ key: 'penalty', kind: 'penalty', n: shotHoleCount(), score: .6 * sum(pens.map(p => holePens(p.h))),
    ev: pens.map(p => ({ date: p.r.date, cost: .6 * holePens(p.h) })), chances: traced.map(p => ({ date: p.r.date, hit: !!holePens(p.h) })),
    title: `Penalty strokes: ${sum(pens.map(p => holePens(p.h)))} in ${plural(shotHoleCount(), 'hole')}`,
    detail: `On ${pens.map(p => 'hole ' + p.h.n).join(', ')}. Worth checking the trace to see what caused it.`, recs: pens });
  items.push(...swingItems());
  return items.sort((a, b) => b.score - a.score);
}

// Strike, measured on the range. Flags a club when at least STRIKE_FLAG of
// its full swings (in the recency window) are low runners or tops, and
// says whether the latest session still shows it — the case where an old
// tip is still coming up today.
const STRIKE_FLAG = 0.35, STRIKE_MIN = 10;
function strikeItem(code) {
  const shots = fullShots(code); if (shots.length < STRIKE_MIN) return null;
  const prof = classify(shots), bad = (_, i) => prof[i] === 'runner' || prof[i] === 'top';
  const nBad = shots.filter(bad).length; if (nBad / shots.length < STRIKE_FLAG) return null;
  const s = clubStats(code);
  const dates = [...new Set(shots.map(x => x.date))].sort(), latest = dates[dates.length - 1];
  const inLatest = shots.map((x, i) => [x, i]).filter(([x]) => x.date === latest), before = shots.map((x, i) => [x, i]).filter(([x]) => x.date !== latest);
  const rate = xs => xs.filter(([, i]) => bad(null, i)).length / xs.length;
  let status = null, note = null;
  if (inLatest.length >= 5 && before.length >= 5) {
    const now = rate(inLatest), was = rate(before);
    if (now < STRIKE_FLAG && now <= was * 0.6) { status = 'quiet'; note = `Improving: ${Math.round(now * 100)}% in the latest session (${dateLabel(latest)}) against ${Math.round(was * 100)}% before.`; }
    else note = `Still showing up in the latest range session (${dateLabel(latest)}): ${inLatest.filter(([, i]) => bad(null, i)).length} of ${inLatest.length}, against ${Math.round(was * 100)}% before.`;
  } else note = `Last seen in the range session of ${dateLabel(latest)}.`;
  return { key: 'strike:' + code, kind: 'strike', n: shots.length, score: .05 * nBad, status, note,
    ev: shots.filter(bad).map(x => ({ date: x.date, cost: .05 })),
    title: `${code} strike: ${pct(nBad, shots.length)}% low runners or topped`,
    detail: `${s.runner} low runners and ${s.top} tops in ${shots.length} full swings.${s.pureCarry ? ` Stock carry ${fmt(s.stockCarry)}m against ${fmt(s.pureCarry)}m when you catch it pure.` : ''}`,
    block: { club: code, swing: 'full', target: round5(s.pureCarry || s.stockCarry), intent: 'Strike: count pure strikes against low runners — ball first, then turf' } };
}

/* ---------- weighting and freshness ----------
   The list grows with every round, so each item is judged on how recent its
   evidence is and whether it's still happening. Worked out on every draw
   from the dated evidence; nothing is stored.
   - weight: sum of each piece of evidence's cost, halved every
     PRACTICE_HALF_LIFE days. A judgement about how fast a beginner's game
     moves, not a measurement.
   - quiet: it had enough clean chances since it was last seen that, at its
     old rate, it would probably (80%) have happened again; or it was last
     seen more than STALE_AFTER days ago. Quiet items leave the list and the
     plan, and are listed separately with the reason.
   - practised: a range block for its club and swing was hit on or after the
     day it was last seen, and the course hasn't confirmed it yet. It stays
     on the list at half weight. */
const PRACTICE_HALF_LIFE = 60, STALE_AFTER = 180;
// Whole local days, as for club distances: to the millisecond, two draws moments apart
// weighed the same evidence differently in the tenth decimal (a 2.11.3 publish failed on it).
const ageDays = d => d ? daysAgo(d) : 0;
const decay = d => Math.pow(0.5, ageDays(d) / PRACTICE_HALF_LIFE);
// The latest day a range block for this club and swing was actually hit, on or after `since`.
function practisedSince(block, since) {
  if (!block) return null;
  return S.sessions.filter(s => s.type === 'range' && s.date && (!since || s.date >= since)
    && (s.blocks || []).some(b => b.club === block.club && (b.swing || 'full') === (block.swing || 'full') && !b.plan && ((b.shots || []).length || b.summary)))
    .map(s => s.date).sort().pop() || null;
}
function assessPractice(it) {
  const ev = it.ev || [], lastSeen = ev.map(e => e.date).filter(Boolean).sort().pop() || null;
  const weight = it.fixedWeight != null ? it.fixedWeight : sum(ev.map(e => e.cost * (e.date ? decay(e.date) : 1)));
  let status = it.status || 'active', note = it.note || (lastSeen ? `Last seen ${dateLabel(lastSeen)}.` : '');
  if (!it.status && lastSeen && ageDays(lastSeen) > STALE_AFTER) {
    status = 'quiet'; note = `Last seen ${dateLabel(lastSeen)}, more than six months ago — too old to plan around.`;
  } else if (!it.status && lastSeen && it.kind !== 'strike' && it.kind !== 'swing') {
    const ch = it.chances || [], hits = ch.filter(c => c.hit).length, clean = ch.filter(c => c.date > lastSeen).length;
    const rate = ch.length ? hits / ch.length : 1;
    const needed = rate >= 1 ? 3 : Math.max(3, Math.ceil(Math.log(0.2) / Math.log(1 - rate)));
    const practised = practisedSince(it.block, lastSeen);
    if (ch.length && clean >= needed) { status = 'quiet'; note = `Not seen in ${plural(clean, 'chance')} since ${dateLabel(lastSeen)}; at the old rate (${hits} in ${ch.length}) it would probably have shown up by now.`; }
    else if (practised) { status = 'practised'; note = `Last seen ${dateLabel(lastSeen)}. Worked on at the range ${dateLabel(practised)} — ${clean ? `${plural(clean, 'clean chance')} on course since, not yet enough to call it fixed` : 'not tested on course since'}.`; }
    else if (clean) note = `Last seen ${dateLabel(lastSeen)}; ${plural(clean, 'clean chance')} since, not yet enough to call it fixed.`;
  }
  return { ...it, lastSeen, status, note, weight: weight * (status === 'practised' ? 0.5 : 1) };
}
// What to practise now, ranked; and what has gone quiet.
// A current swing reading about a club that already has a ball-data item
// joins that item as supporting evidence instead of being listed on its
// own: video ranks below ball data, and adds weight (half its own) only
// when it agrees with it.
function rankedPractice() {
  const all = practiceItems().map(assessPractice), byWeight = (a, b) => b.weight - a.weight;
  let now = all.filter(x => x.status !== 'quiet');
  for (const sw of now.filter(x => x.kind === 'swing' && x.club)) {
    const host = now.filter(x => x.kind !== 'swing' && x.block && x.block.club === sw.club).sort(byWeight)[0];
    if (!host) continue;
    host.support = [...(host.support || []), sw];
    if (sw.agrees) host.weight += sw.weight / 2;
    if (sw.drillName) host.block = { ...host.block, intent: `${host.block.intent}. Drill from the video: ${sw.drillName}` };
    now = now.filter(x => x !== sw);
  }
  return { now: now.sort(byWeight), quiet: all.filter(x => x.status === 'quiet').sort(byWeight) };
}

/* ---------- 3. calibration: course distance vs range ---------- */
function calibration() {
  const by = {};
  for (const x of shotRecords().filter(x => x.full && x.club)) (by[x.club] = by[x.club] || []).push(x);
  return Object.entries(by).map(([club, xs]) => {
    const ref = totalRef(club), med = median(xs.map(x => x.len)), n = xs.length;
    // Short shots are plausible mishits. Only shots LONGER than the range allows are suspect data.
    const ceiling = ref ? Math.max(ref.max || 0, ref.v + Math.max(25, 0.25 * ref.v)) : null;
    const suspect = ceiling ? xs.filter(x => x.len > ceiling && !(x.s && x.s.verified)) : [];
    return { club, n, med, ref, delta: ref ? med - ref.v : null, status: n >= 8 ? 'calibrated' : n >= 3 ? 'early' : 'too few', suspect, xs };
  }).sort((a, b) => ((b.ref && b.ref.v) || 0) - ((a.ref && a.ref.v) || 0));
}

/* ---------- views ---------- */
const KIND_LABEL = { tee: 'Off the tee', approach: 'Approach', measure: 'Gapping', strike: 'Strike', short: 'Short game', putting: 'Putting', penalty: 'Penalties', swing: 'Swing video' };
const freshLine = it => it.note ? `<div class="fresh small ${it.status}">${it.status === 'practised' ? '<span class="tag">worked on</span> ' : ''}${esc(it.note)}</div>` : '';
function practiceCard(it, i) {
  const b = it.block;
  // Video readings collapse: they are long, and they rank below ball data.
  if (it.kind === 'swing') return `<details class="pcard k-swing" id="pc-${esc(it.key || i)}">
    <summary><span class="small muted">${i + 1}. ${KIND_LABEL[it.kind]}</span> <b>${esc(it.title)}</b> <span class="tag">read from video</span></summary>
    ${freshLine(it)}<div class="small" style="margin-top:6px">${esc(it.detail)}</div>
    ${it.advice ? `<div class="small" style="margin-top:4px"><b>Video vs numbers:</b> ${esc(String(it.advice).replace(/^Video vs numbers: /, ''))}</div>` : ''}
    ${it.practice ? `<div class="small" style="margin-top:4px"><b>Drill:</b> ${esc(it.practice)}</div>` : ''}
    ${it.range ? `<div class="small muted" style="margin-top:4px">${esc(it.range)}</div>` : ''}
  </details>`;
  // What's wrong, what to hit, whether it's getting better. The evidence
  // behind it (every shot, the ball data, the holes) is on the objective page.
  const sup = (it.support || [])[0];
  return `<div class="pcard k-${it.kind}">
    <div class="spread"><span class="small muted">${i + 1}. ${KIND_LABEL[it.kind]}</span><span class="tag ${it.n >= 12 ? 'green' : ''}">${it.video ? 'read from video' : confidence(it.n) + ', n=' + it.n}</span></div>
    <div class="pt">${esc(it.title)}</div>${freshLine(it)}
    ${b ? `<div class="do"><span class="tag green">${esc(b.club)} · ${b.swing}${b.target ? ' · ' + b.target + 'm' : ''}</span> ${esc(b.intent)}</div>` : it.practice ? `<div class="do">${esc(it.practice)}</div>` : ''}

/* ============================================================
   The practice loop (2.6.0)
   One named objective follows a finding from the course to the range and

   range sessions that hit it, and how it has gone on the course since.

  const practised = practisedSince(it.block, firstSeen);

  return `<div class="notice" id="sessionGoals"><b>${done ? 'Plan done' : `${hit} of ${plural(planned.length, 'planned block')} hit`}.</b>${goals.length ? ` Working on: ${goals.map(g => `<button class="quiet" style="padding:0 4px" data-go="range:goal=${esc(g.key)}">${esc(goalName(g))}</button>`).join(' · ')}.` : ''}
    ${done ? ' Your next round shows how it went on the course: each one above has the before and since.' : ' After you hit a block, add its screenshots; a block for the same club fills the plan.'}</div>`;
}
// The objective over time: one column per round, how often it happened that
// round (its own dated chances), and a line for each range day that hit its
// club and swing, in date order. The last ten rounds. A picture of what
// happened, labelled as such; the before/since tiles carry the numbers.
function goalHistory(it) {
  const w = MISS_WORD[it.kind]; if (!w) return '';
  const by = new Map();
  for (const c of (it.chances || []).filter(c => c.date)) { const x = by.get(c.date) || { date: c.date, n: 0, hit: 0 }; x.n++; if (c.hit) x.hit++; by.set(c.date, x); }
  const rounds = [...by.values()].sort((a, b) => a.date.localeCompare(b.date)).slice(-10);
  if (rounds.length < 2) return '';
  const first = rounds[0].date, b = it.block;
  const ranges = b ? [...new Set(S.sessions.filter(s => s.type === 'range' && s.date && s.date >= first && (s.blocks || []).some(x => blockHit(x) && x.club === b.club && (x.swing || 'full') === (b.swing || 'full'))).map(s => s.date))] : [];
  const ev = rounds.map(x => ({ ...x, k: 'round' })).concat(ranges.map(d => ({ date: d, k: 'range' })))
    .sort((a, c) => a.date.localeCompare(c.date) || (a.k === 'range' ? -1 : 1));    // a range day before a round on the same day
  const W = 320, top = 16, base = 92, H = 112, units = sum(ev.map(e => e.k === 'round' ? 1 : 0.5)), slot = W / units;
  const bw = Math.min(24, slot * 0.6), short = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  let x = 0, g = `<line class="gx" x1="0" y1="${base}" x2="${W}" y2="${base}"/>`;
  const cols = [];
  ev.forEach(e => {
    if (e.k === 'range') { const cx = x + slot * 0.25; g += `<line class="rg" x1="${cx.toFixed(1)}" y1="${top - 6}" x2="${cx.toFixed(1)}" y2="${base}"><title>${esc(dateLabel(e.date))}: range session for it</title></line>`; x += slot * 0.5; return; }
    const cx = x + slot / 2, hgt = Math.max(2, (base - top) * e.hit / e.n), y = base - hgt, l = cx - bw / 2, rr = Math.min(4, hgt / 2);
    g += `<path class="col" d="M${l.toFixed(1)},${base}V${(y + rr).toFixed(1)}Q${l.toFixed(1)},${y.toFixed(1)} ${(l + rr).toFixed(1)},${y.toFixed(1)}H${(l + bw - rr).toFixed(1)}Q${(l + bw).toFixed(1)},${y.toFixed(1)} ${(l + bw).toFixed(1)},${(y + rr).toFixed(1)}V${base}Z"><title>${esc(dateLabel(e.date))}: ${e.hit} of ${e.n} ${w}</title></path>
      <rect class="hitbox" x="${(cx - slot / 2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${base}"><title>${esc(dateLabel(e.date))}: ${e.hit} of ${e.n} ${w}</title></rect>`;
    cols.push({ cx, y, e }); x += slot;
  });
  // Labels: the first and last round's date, and the latest round's rate at its column.
  const lastC = cols[cols.length - 1], firstC = cols[0];
  g += `<text class="tk" x="${firstC.cx.toFixed(1)}" y="${H - 4}" text-anchor="middle">${short(firstC.e.date)}</text>`;
  if (lastC !== firstC) g += `<text class="tk" x="${lastC.cx.toFixed(1)}" y="${H - 4}" text-anchor="middle">${short(lastC.e.date)}</text>`;
  g += `<text class="vl" x="${lastC.cx.toFixed(1)}" y="${(lastC.y - 4).toFixed(1)}" text-anchor="middle">${pct(lastC.e.hit, lastC.e.n)}%</text>`;
  return `<h2>Round by round</h2><svg class="ghist" id="goalHistory" viewBox="0 0 ${W} ${H}" role="img" aria-label="How often it happened in each of the last ${rounds.length} rounds">${g}</svg>
    <p class="small muted">Each column is a round: how often it ${w}, out of its chances that round (0 to 100%).${ranges.length ? ' A line marks a range session that worked on it.' : ''} Tap a column for its numbers.</p>` +
    fold('goalTable', 'As a table', '', `<table class="mini"><thead><tr><th>Round</th><th>Chances</th><th>${esc(w)}</th></tr></thead><tbody>${rounds.slice().reverse().map(x => `<tr><td>${dateLabel(x.date)}</td><td>${x.n}</td><td>${x.hit} (${pct(x.hit, x.n)}%)</td></tr>`).join('')}</tbody></table>`);
}
