services:
  carry:
    build: .
    # Or, once you've pushed an image:
    # image: ghcr.io/zeinbenjamin/woods:latest   (or a pinned :<version>)
    container_name: carry
    restart: unless-stopped
    init: true
    # TrueNAS SCALE runs apps as the `apps` user, 568:568. The dataset at
    # DATA_PATH is owned by it, so the container must write as it too —
    # the image's default user (node, 1000) can't create the SQLite WAL.
    user: "${APP_UID:-568}:${APP_GID:-568}"
    ports:
      - "1818:1818"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      OWNER_EMAIL: ${OWNER_EMAIL}
      CARRY_MODEL: ${CARRY_MODEL:-claude-sonnet-4-6}
      MAX_ASSET_MB: ${MAX_ASSET_MB:-200}
      TZ: ${TZ:-Australia/Sydney}
      HOME: /tmp
    volumes:
      # On TrueNAS point this at a dataset, e.g. /mnt/tank/apps/carry
      - ${DATA_PATH:-./data}:/data
