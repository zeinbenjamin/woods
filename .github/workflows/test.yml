name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      # A pull request that changes what ships must bump the version and say
      # what changed in CHANGELOG.md. See scripts/check-version.js.
      - if: github.event_name == 'pull_request'
        run: node scripts/check-version.js "origin/${{ github.base_ref }}"
