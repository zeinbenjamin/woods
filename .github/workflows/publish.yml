# Builds the image and pushes it to GitHub Container Registry, so TrueNAS
# can pull it. The Custom App form cannot build from source — it only
# pulls — which is why this exists.
#
# Versioning: package.json's version is the release number. Every push to
# main publishes :latest and :sha-<short>. When main carries a version that
# has no git tag yet, this also publishes :<version> (e.g. :1.1.0), creates
# the tag v<version>, and a GitHub release whose notes are that version's
# CHANGELOG.md section. Version tags are written once and never moved.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag and release
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Nothing is published from a red main: the tests run here first, so a
      # merge that broke them stops before an image or a tag exists.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test

      - id: v
        name: Work out the version and whether it's new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.new == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # add linux/arm64 if your NAS is ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The commit, shown in the app. The metadata labels also stamp it as
          # org.opencontainers.image.revision, readable with docker inspect.
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and release a new version
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/changelog-section.js "$VERSION" > notes.md
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
